<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>New vehicle and Settings icons</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&amp;family=Sora:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1100px; height: 440px; box-sizing: border-box; padding: 28px 32px; background: #11151D; color: #F2F5FA; font-family: 'Sora', Arial, sans-serif; display: flex; gap: 28px">
<div style="display: flex; flex-direction: column; gap: 16px; flex-grow: 1">
<span style="font-family: 'JetBrains Mono', monospace; font-size: 10.5px; letter-spacing: .14em; color: #929EAF">VEHICLE TYPES · 24 PX GRID, 1.7 STROKE, WHEELS AS RINGS WITH A HUB NODE</span>
<div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px">
<sc-for list="{{icons}}" as="i" hint-placeholder-count="9">
<div style="display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 16px 8px 12px; border-radius: 16px; background: rgba(34,45,61,.7); box-shadow: inset 0 0 0 1px #303B4B, inset 0 1px 0 rgba(255,255,255,.06)">
<svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="#F2F5FA" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="{{i.name}} icon">
<path d="{{i.d}}"></path>
<sc-for list="{{i.wheels}}" as="w" hint-placeholder-count="2">
<circle cx="{{w.cx}}" cy="{{w.cy}}" r="{{w.r}}"></circle>
<circle cx="{{w.cx}}" cy="{{w.cy}}" r="0.95" fill="#4388F5" stroke="none"></circle>
</sc-for>
<sc-for list="{{i.nodes}}" as="n" hint-placeholder-count="1">
<circle cx="{{n.x}}" cy="{{n.y}}" r="1.9" fill="#4388F5" stroke="none"></circle>
</sc-for>
</svg>
<span style="font-size: 12.5px; color: #A3ADBD">{{i.name}}</span>
</div>
</sc-for>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 16px; width: 260px">
<span style="font-family: 'JetBrains Mono', monospace; font-size: 10.5px; letter-spacing: .14em; color: #929EAF">SETTINGS · THREE SLIDERS</span>
<div style="display: flex; align-items: center; gap: 16px; padding: 16px; border-radius: 16px; background: rgba(34,45,61,.7); box-shadow: inset 0 0 0 1px #303B4B">
<svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="#F2F5FA" stroke-width="1.7" stroke-linecap="round" role="img" aria-label="Settings icon">
<path d="M4 6.5h16M4 12h16M4 17.5h16"></path>
<circle cx="9" cy="6.5" r="2.3" fill="#4388F5" stroke="#11151D" stroke-width="1.2"></circle>
<circle cx="15.5" cy="12" r="2.3" fill="#4388F5" stroke="#11151D" stroke-width="1.2"></circle>
<circle cx="7" cy="17.5" r="2.3" fill="#4388F5" stroke="#11151D" stroke-width="1.2"></circle>
</svg>
<p style="margin: 0; font-size: 12.5px; line-height: 1.5; color: #A3ADBD">Replaces the crosshair. The knobs are the hub's nodes, so it reads as "set things" at a glance.</p>
</div>
<span style="font-family: 'JetBrains Mono', monospace; font-size: 10.5px; letter-spacing: .14em; color: #929EAF">IN THE RAIL</span>
<div style="display: flex; flex-direction: column; align-items: center; gap: 8px; width: 72px; padding: 12px 0; border-radius: 16px; background: #0D1118; box-shadow: inset 0 0 0 1px #222D3D">
<span style="display: flex; align-items: center; justify-content: center; width: 48px; height: 48px; border-radius: 12px; background: #1D355A; box-shadow: inset 0 0 0 1px rgba(67,136,245,.45)">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#4388F5" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{car}}"></path><circle cx="6.5" cy="15.8" r="2.3"></circle><circle cx="17.5" cy="15.8" r="2.3"></circle></svg>
</span>
<span style="display: flex; align-items: center; justify-content: center; width: 48px; height: 48px">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#929EAF" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M4 6.5h16M4 12h16M4 17.5h16"></path><circle cx="9" cy="6.5" r="2.3" fill="#929EAF" stroke="#0D1118" stroke-width="1.2"></circle><circle cx="15.5" cy="12" r="2.3" fill="#929EAF" stroke="#0D1118" stroke-width="1.2"></circle><circle cx="7" cy="17.5" r="2.3" fill="#929EAF" stroke="#0D1118" stroke-width="1.2"></circle></svg>
</span>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1100,"height":440}}'>
class Component extends DCLogic {
renderVals() {
const low = 'M8.8 15.5h6.4M2.5 15.5h1.7M19.8 15.5h1.7';
const car = 'M2.5 15.5v-2.3c0-.8.5-1.4 1.2-1.6l3-.9 2.6-2.9c.4-.4.9-.7 1.5-.7h4.6c.6 0 1.2.3 1.6.8l2.2 2.8 1.9.4c.8.2 1.4.9 1.4 1.7v2.7M9.6 10.7h7.6' + low;
const w2 = (a, b, r) => [{ cx: a[0], cy: a[1], r }, { cx: b[0], cy: b[1], r }];
const icons = [
{ name: 'Car', d: car, wheels: w2([6.5, 15.8], [17.5, 15.8], 2.3), nodes: [] },
{ name: 'SUV / Jeep', d: 'M2.5 15.5v-4c0-.6.4-1 1-1h1.8l2.2-3.6c.2-.3.5-.4.8-.4h8.4c.4 0 .7.2.9.5l2 3.5h.9c.6 0 1 .4 1 1v4M8 5h8' + low, wheels: w2([6.5, 15.8], [17.5, 15.8], 2.3), nodes: [] },
{ name: 'Van', d: 'M2.5 15.5V8c0-.6.4-1 1-1h11.3c.3 0 .6.1.8.4l3.9 4.1 1.6.6c.5.2.9.7.9 1.2v2.2M15 7.6v3.9h4.2' + low, wheels: w2([6.5, 15.8], [17.5, 15.8], 2.3), nodes: [] },
{ name: 'Pickup / Truck', d: 'M2.5 15.5V11H12V7.5c0-.3.2-.5.5-.5h4.3c.4 0 .7.2.9.5l2.3 3.5 1.4.5c.4.1.6.5.6.9v3.1M12 11h7.5' + low, wheels: w2([6.5, 15.8], [17.5, 15.8], 2.3), nodes: [] },
{ name: 'Motorbike', d: 'M5.5 16l3.6-5.5h4.8l1.9 3M9.1 10.5 8 8H5.5M13.9 10.5l2.1-3.2h2.1M15.8 13.5l2.7 2.5', wheels: w2([5.5, 16], [18.5, 16], 3), nodes: [{ x: 18.2, y: 7.3 }] },
{ name: 'Scooter', d: 'M6 17h8.5c0-3.3 1-5.5 3-6.5l-1-4.5h2.4M8.4 17c.2-2.2 1.6-3.5 4-3.5h3', wheels: w2([6, 17], [18, 17], 2.4), nodes: [{ x: 18.9, y: 6 }] },
{ name: 'Three-wheeler', d: 'M3.5 16V9.5c0-2.2 1.8-4 4-4H15l3.5 5V16M3.5 12.5h15M10.5 5.5v7M9 16h6', wheels: w2([6.5, 16.6], [17.5, 16.6], 2), nodes: [] },
{ name: 'Bus', d: 'M4 16.5V5.5C4 4.7 4.7 4 5.5 4h13c.8 0 1.5.7 1.5 1.5v11zM4 11h16M9 4v7M15 4v7', wheels: w2([7.5, 18.3], [16.5, 18.3], 1.7), nodes: [] },
{ name: 'Bicycle', d: 'M5.5 15.5l4-7h6l3 7M9.5 8.5l2.5 7H5.5M15.5 8.5l-.8-2.3h2.2M8.2 6.2h2.6', wheels: w2([5.5, 15.5], [18.5, 15.5], 3.4), nodes: [{ x: 12, y: 15.5 }] },
];
return { icons, car };
}
}
</script>
</body>
</html>
