<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>hub Home phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Oxanium:wght@400;500;600;700&family=Sora:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Sora',Arial,sans-serif;color:#F2F5FA}
.d{font-family:'Oxanium',Arial,sans-serif;letter-spacing:-.025em}
.m{font-family:'JetBrains Mono',monospace}
.eb{font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:#929EAF}
.card{background:#1A2230;border:1px solid #303B4B;border-radius:18px}
@keyframes flow{to{stroke-dashoffset:-18}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
</style>
</helmet>
<div style="position:relative;width:390px;height:1000px;background:#11151D;overflow:hidden">
<div style="padding:18px 16px 0;display:flex;flex-direction:column;gap:12px">

<header style="display:flex;align-items:center;gap:12px">
<dc-import name="HubMark" size="30" color="#4388F5" hint-size="24px,30px"></dc-import>
<div><span class="eb">Wed 18 Nov · day 13/30</span><h1 style="margin:2px 0 0;font-size:26px;font-weight:400;letter-spacing:-.02em;line-height:1.1">Evening, Anuja.</h1></div>
<span aria-label="Signed in" style="margin-left:auto;display:flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:50%;background:#222D3D;box-shadow:inset 0 0 0 1px #303B4B;font-size:14px;font-weight:600">A</span>
</header>

<a href="#" aria-label="Electricity right now" style="display:flex;flex-direction:column;gap:12px;padding:16px;border-radius:24px;background:radial-gradient(120% 90% at 85% 0%,#16233A 0%,#0D1118 60%);border:1px solid #222D3D;text-decoration:none;color:#F2F5FA">
<div style="display:flex;align-items:center;gap:8px"><span class="eb">/ Electricity</span><span class="m" style="margin-left:auto;display:inline-flex;align-items:center;gap:6px;font-size:10px;letter-spacing:.12em;color:#4388F5"><span style="width:6px;height:6px;border-radius:50%;background:#4388F5;animation:pulse 2s ease-in-out infinite"></span>B LIVE</span></div>
<div style="display:flex;align-items:flex-end;gap:10px"><span class="d" style="font-size:64px;font-weight:600;line-height:.85">189</span><span style="padding-bottom:4px;font-size:13px;line-height:1.35;color:#B7C0CD">units before<br>a price jump</span></div>
<sc-for list="{{meters}}" as="m" hint-placeholder-count="2">
<div style="display:flex;align-items:center;gap:10px">
<span class="m" style="flex:none;display:inline-flex;align-items:center;justify-content:center;width:22px;height:18px;border-radius:5px;background:#222D3D;box-shadow:inset 0 0 0 1px {{m.ring}};font-size:10px;font-weight:600">{{m.letter}}</span>
<svg viewBox="0 0 230 16" width="100%" height="16" aria-label="{{m.label}}" style="flex:1">
<line x1="4" y1="8" x2="226" y2="8" stroke="#303B4B" stroke-width="2"></line>
<line x1="4" y1="8" x2="{{m.x}}" y2="8" stroke="{{m.fill}}" stroke-width="3.5" stroke-linecap="round"></line>
<line x1="{{m.x}}" y1="8" x2="{{m.px}}" y2="8" stroke="{{m.fill}}" stroke-width="1.6" stroke-dasharray="3 5" style="animation:flow 1.2s linear infinite"></line>
<circle cx="137.2" cy="8" r="4.5" fill="#0D1118" stroke="#F5B94A" stroke-width="1.8"></circle>
<circle cx="203.8" cy="8" r="4.5" fill="#0D1118" stroke="#FF6B61" stroke-width="1.8"></circle>
<circle cx="{{m.x}}" cy="8" r="4.5" fill="{{m.fill}}" stroke="#0D1118" stroke-width="2"></circle>
</svg>
<span style="flex:none;width:58px;text-align:right"><span class="d" style="font-size:18px;font-weight:600">{{m.left}}</span><span style="font-size:10px;color:#929EAF"> left</span></span>
</div>
</sc-for>
</a>

<a href="#" style="display:flex;align-items:center;justify-content:center;gap:10px;min-height:54px;border-radius:14px;background:#4388F5;color:#0D1118;font-size:16px;font-weight:600;text-decoration:none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0D1118" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 3L6 13h6l-1 8 7-10h-6z"></path></svg>Read the meters</a>

<section aria-label="The next 30 days" class="card" style="padding:12px 14px 8px">
<div style="display:flex;align-items:baseline"><span class="eb">Next 30 days</span><a href="#" style="margin-left:auto;font-size:12px;font-weight:600;color:#4388F5;text-decoration:none">Reminders</a></div>
<svg viewBox="0 0 330 64" width="100%" height="64" role="img" aria-label="Today 18 Nov; meter reads on 20, 21, 25 and 26 Nov; two bills due 4 Dec">
<line x1="6" y1="26" x2="324" y2="26" stroke="#303B4B" stroke-width="2"></line>
<sc-for list="{{events}}" as="e" hint-placeholder-count="5">
<line x1="{{e.x}}" y1="26" x2="{{e.x}}" y2="{{e.stemY}}" stroke="{{e.c}}" stroke-width="1.2" opacity=".6"></line>
<circle cx="{{e.x}}" cy="26" r="{{e.r}}" fill="{{e.fill}}" stroke="{{e.c}}" stroke-width="2"></circle>
<text x="{{e.x}}" y="{{e.labelY}}" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="8.5" fill="{{e.c}}">{{e.label}}</text>
</sc-for>
<circle cx="6" cy="26" r="6" fill="#4388F5" stroke="#1A2230" stroke-width="2.5"></circle>
<text x="6" y="58" font-family="JetBrains Mono, monospace" font-size="9" fill="#F2F5FA">TODAY</text>
<text x="324" y="58" text-anchor="end" font-family="JetBrains Mono, monospace" font-size="9" fill="#929EAF">18 DEC</text>
</svg>
</section>

<section aria-label="Needs you next" class="card" style="padding:4px 14px">
<h2 class="eb" style="margin:10px 0 4px;font-weight:400">Needs you next</h2>
<sc-for list="{{todo}}" as="t" hint-placeholder-count="3">
<a href="#" style="display:flex;align-items:center;gap:12px;min-height:60px;border-top:1px solid #222D3D;text-decoration:none;color:#F2F5FA">
<span style="width:9px;height:9px;border-radius:50%;background:{{t.lamp}};flex:0 0 9px"></span>
<span style="flex:1;min-width:0"><span style="display:block;font-size:15px;font-weight:600">{{t.title}}</span><span style="display:block;font-size:12px;color:#A3ADBD">{{t.sub}}</span></span>
<span class="m" style="font-size:10.5px;color:#B7C0CD">{{t.when}}</span>
</a>
</sc-for>
</section>

<div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px">
<sc-for list="{{tiles}}" as="m" hint-placeholder-count="3">
<a href="#" class="card" style="display:flex;flex-direction:column;gap:4px;padding:12px;text-decoration:none;color:#F2F5FA">
<span style="display:flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:9px;background:rgba(34,45,61,.7);box-shadow:inset 0 0 0 1px #303B4B,inset 0 1px 0 rgba(255,255,255,.06)"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#B7C0CD" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{m.d}}"></path><sc-for list="{{m.nodes}}" as="p" hint-placeholder-count="2"><circle cx="{{p.x}}" cy="{{p.y}}" r="1.9" fill="#B7C0CD" stroke="none"></circle></sc-for></svg></span>
<span class="d" style="font-size:24px;font-weight:600;line-height:1.1;margin-top:4px">{{m.big}}</span>
<span style="font-size:11px;line-height:1.35;color:#A3ADBD">{{m.sub}}</span>
</a>
</sc-for>
</div>
</div>

<div style="position:absolute;left:0;right:0;bottom:0"><dc-import name="HubNav" active="home" hint-size="390px,84px"></dc-import></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1000}}'>
class Component extends DCLogic {
renderVals() {
const P = (pts) => pts.map(([x, y]) => ({ x, y }));
const X = (u) => Math.min(226, 4 + (u / 200) * 222);
const D = (days) => 6 + (days / 30) * 318;
const read = (d, label, up) => ({ x: D(d), label, c: '#B7C0CD', fill: '#1A2230', r: 4.5, stemY: up ? 12 : 40, labelY: up ? 9 : 50 });
return {
meters: [
{ letter: 'A', ring: '#303B4B', fill: '#929EAF', x: X(24), px: X(60), left: '96', label: 'Meter A, 24 of 120 used' },
{ letter: 'B', ring: '#4388F5', fill: '#4388F5', x: X(87), px: X(217), left: '33', label: 'Meter B, 87 of 120 used, on pace for 217' },
],
events: [
read(2, 'A 20', true), read(3, 'B 21', false), read(7, 'A 25', true), read(8, 'B 26', false),
{ x: D(16), label: '2 BILLS · 4 DEC', c: '#F5B94A', fill: '#3A2E12', r: 7, stemY: 12, labelY: 9 },
],
todo: [
{ title: 'Pay 2 electricity bills', sub: 'LKR 7,913.84 in total', when: '4 DEC', lamp: '#F5B94A' },
{ title: 'Read Meter A', sub: 'last read 3 days ago', when: 'FRI', lamp: '#929EAF' },
{ title: 'Meter B nears 120', sub: 'about 5 days at this pace', when: 'WATCH', lamp: '#4388F5' },
],
tiles: [
{ big: '7,913', sub: 'LKR bills by 4 Dec', d: 'M7 3h10v18l-2.5-1.5L12 21l-2.5-1.5L7 21zM10 8h4M10 12h4', nodes: P([[7, 3], [17, 3]]) },
{ big: '2', sub: 'vehicles, no renewals yet', d: 'M3 16h18M5.5 16l2-5.5h9l2 5.5', nodes: P([[7.5, 19], [16.5, 19]]) },
{ big: '0', sub: 'documents saved', d: 'M6 3h8l4 4v14H6zM14 3v4h4', nodes: P([[14, 3], [18, 7]]) },
],
};
}
}
</script>
</body>
</html>
