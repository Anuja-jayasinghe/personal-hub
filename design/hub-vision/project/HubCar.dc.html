<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>hub car render</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
@keyframes hcSweep{0%{transform:translateX(0)}55%,100%{transform:translateX(520px)}}
@keyframes hcPulse{0%,100%{opacity:.35}50%{opacity:1}}
</style>
</helmet>
<svg width="{{w}}" height="{{h}}" viewBox="0 0 360 170" role="img" aria-label="{{label}}" style="display:block">
<defs>
<linearGradient id="hcBody" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="{{p.b0}}"></stop><stop offset=".38" stop-color="{{p.b1}}"></stop><stop offset=".72" stop-color="{{p.b2}}"></stop><stop offset="1" stop-color="{{p.b3}}"></stop>
</linearGradient>
<linearGradient id="hcGlass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3A4E6E"></stop><stop offset="1" stop-color="#0B0F16"></stop></linearGradient>
<radialGradient id="hcRim" cx=".42" cy=".38" r=".7"><stop offset="0" stop-color="#EEF2F8"></stop><stop offset=".55" stop-color="#8F9BAD"></stop><stop offset="1" stop-color="#3A4558"></stop></radialGradient>
<radialGradient id="hcTyre" cx=".5" cy=".5" r=".5"><stop offset=".72" stop-color="#0B0E13"></stop><stop offset=".92" stop-color="#1F2733"></stop><stop offset="1" stop-color="#0B0E13"></stop></radialGradient>
<radialGradient id="hcGlow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#4388F5" stop-opacity=".38"></stop><stop offset="1" stop-color="#4388F5" stop-opacity="0"></stop></radialGradient>
<radialGradient id="hcLamp" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#DCE8FD" stop-opacity=".9"></stop><stop offset="1" stop-color="#4388F5" stop-opacity="0"></stop></radialGradient>
<linearGradient id="hcSweepG" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0"></stop><stop offset=".5" stop-color="#FFFFFF" stop-opacity=".22"></stop><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"></stop></linearGradient>
<filter id="hcBlur" x="-20%" y="-200%" width="140%" height="500%"><feGaussianBlur stdDeviation="4"></feGaussianBlur></filter>
<clipPath id="hcFloorClip"><rect x="0" y="137" width="360" height="33"></rect></clipPath>
<clipPath id="hcBodyClip"><path d="{{body}}"></path></clipPath>
</defs>

<ellipse cx="182" cy="120" rx="190" ry="60" fill="url(#hcGlow)"></ellipse>
<g clip-path="url(#hcFloorClip)" stroke="#222D3D" stroke-width="1">
<sc-for list="{{rays}}" as="r" hint-placeholder-count="13"><line x1="180" y1="30" x2="{{r}}" y2="170"></line></sc-for>
<sc-for list="{{rows}}" as="y" hint-placeholder-count="4"><line x1="0" y1="{{y}}" x2="360" y2="{{y}}"></line></sc-for>
</g>
<ellipse cx="182" cy="138" rx="160" ry="6" fill="#000000" opacity=".85" filter="url(#hcBlur)"></ellipse>
<path d="M40 137 L330 137" stroke="#4388F5" stroke-opacity=".35" stroke-width="1"></path>

<path d="M62 112 A28 28 0 0 1 118 112 Z" fill="#07090D"></path>
<path d="M244 112 A28 28 0 0 1 300 112 Z" fill="#07090D"></path>

<path d="{{body}}" fill="url(#hcBody)"></path>
<path d="M104 72 C116 60 132 52 152 50 L186 50 L186 72 Z" fill="url(#hcGlass)" stroke="#0B0F16" stroke-width="1"></path>
<path d="M194 50 L222 50 C236 52 248 60 260 71 L194 72 Z" fill="url(#hcGlass)" stroke="#0B0F16" stroke-width="1"></path>
<path d="M120 70 L140 52 L150 52 L130 70 Z" fill="#FFFFFF" opacity=".1"></path>
<path d="M202 70 L216 51 L223 51 L209 70 Z" fill="#FFFFFF" opacity=".1"></path>
<path d="M108 60 C124 49 138 45 150 44 L224 44 C236 45 246 50 258 60" fill="none" stroke="#4388F5" stroke-width="1.3" opacity=".75"></path>
<path d="M40 86 C120 83 240 83 334 88" fill="none" stroke="#FFFFFF" stroke-opacity="{{p.crease}}" stroke-width="1.2"></path>
<path d="M120 106 L242 106" fill="none" stroke="#000000" stroke-opacity=".35" stroke-width="2"></path>
<path d="M118 74 C116 90 116 100 118 110M190 72 L190 110M258 74 C262 86 262 96 258 104" fill="none" stroke="#05070A" stroke-opacity=".55" stroke-width="1"></path>
<rect x="144" y="82" width="14" height="3" rx="1.5" fill="#FFFFFF" opacity=".35"></rect>
<rect x="218" y="82" width="14" height="3" rx="1.5" fill="#FFFFFF" opacity=".35"></rect>
<path d="M256 70 L268 67 L271 74 L258 75 Z" fill="{{p.b1}}" stroke="#05070A" stroke-opacity=".5" stroke-width=".8"></path>
<path d="M314 80 L333 84 C337 86 338 88 338 91 L320 88 Z" fill="#DCE8FD"></path>
<ellipse cx="338" cy="88" rx="22" ry="10" fill="url(#hcLamp)" style="animation:hcPulse 3s ease-in-out infinite"></ellipse>
<path d="M23 93 L33 86 L45 84 L41 91 Z" fill="#FF6B61"></path>
<ellipse cx="26" cy="90" rx="9" ry="5" fill="#FF6B61" opacity=".35"></ellipse>
<path d="M335 100 L342 100 L341 109 L333 109 Z" fill="#05070A" opacity=".8"></path>
<g clip-path="url(#hcBodyClip)"><rect x="-90" y="30" width="70" height="90" fill="url(#hcSweepG)" transform="skewX(-18)" style="animation:hcSweep 6s ease-in-out infinite"></rect></g>

<sc-for list="{{wheels}}" as="wh" hint-placeholder-count="2">
<ellipse cx="{{wh.x}}" cy="137.5" rx="24" ry="3.2" fill="#000000" opacity=".9" filter="url(#hcBlur)"></ellipse>
<circle cx="{{wh.x}}" cy="114" r="23" fill="url(#hcTyre)" stroke="#2A3445" stroke-width="1.2"></circle>
<circle cx="{{wh.x}}" cy="114" r="15.5" fill="url(#hcRim)"></circle>
<circle cx="{{wh.x}}" cy="114" r="11.5" fill="#141A24" opacity=".75"></circle>
<sc-for list="{{wh.spokes}}" as="s" hint-placeholder-count="5"><line x1="{{wh.x}}" y1="114" x2="{{s.x}}" y2="{{s.y}}" stroke="#C9D2DE" stroke-width="3.2" stroke-linecap="round"></line></sc-for>
<circle cx="{{wh.x}}" cy="114" r="4" fill="#4388F5" stroke="#0B0E13" stroke-width="1.5"></circle>
</sc-for>
</svg>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"width":{"editor":"number","default":340},"paint":{"editor":"enum","default":"graphite","options":["graphite","pearl","blue"]},"label":{"editor":"text","default":"The car, side view"},"$preview":{"width":360,"height":170}}'>
class Component extends DCLogic {
renderVals() {
const w = parseFloat(this.props.width ?? 340) || 340;
const paints = {
graphite: { b0: '#56667F', b1: '#2C384B', b2: '#1A2230', b3: '#0E131B', crease: '.22' },
pearl: { b0: '#FFFFFF', b1: '#D9DFE8', b2: '#A9B3C2', b3: '#5D6878', crease: '.6' },
blue: { b0: '#7FB0FF', b1: '#3A78E0', b2: '#1D4A99', b3: '#0E2550', crease: '.3' },
};
const spokes = (cx) => [0, 72, 144, 216, 288].map((a) => {
const r = (a - 90) * Math.PI / 180;
return { x: Math.round((cx + Math.cos(r) * 14) * 10) / 10, y: Math.round((114 + Math.sin(r) * 14) * 10) / 10 };
});
const rays = [];
for (let x = -300; x <= 660; x += 80) rays.push(x);
return {
w, h: Math.round(w * 170 / 360),
label: this.props.label ?? 'The car, side view',
p: paints[this.props.paint ?? 'graphite'] ?? paints.graphite,
body: 'M26 112 L22 98 C22 88 26 82 34 80 L44 77 L94 72 C108 58 128 46 150 44 L224 44 C238 46 252 58 270 72 L322 80 C334 82 340 88 342 98 L340 112 L300 112 A28 28 0 0 0 244 112 L118 112 A28 28 0 0 0 62 112 Z',
rays, rows: [141, 147, 155, 166],
wheels: [{ x: 90, spokes: spokes(90) }, { x: 272, spokes: spokes(272) }],
};
}
}
</script>
</body>
</html>
