<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>hub Tasks and notes</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Oxanium:wght@400;500;600;700&family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Sora',Arial,sans-serif;color:#F2F5FA}
.d{font-family:'Oxanium',Arial,sans-serif;letter-spacing:-.025em}
.m{font-family:'JetBrains Mono',monospace}
.eb{font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:#929EAF}
.card{background:#1A2230;border:1px solid #303B4B;border-radius:18px}
@keyframes tick{from{stroke-dashoffset:20}to{stroke-dashoffset:0}}
@keyframes strike{from{transform:scaleX(0)}to{transform:scaleX(1)}}
</style>
</helmet>
<div style="position:relative;width:390px;height:900px;background:#11151D;overflow:hidden">
<div style="padding:18px 16px 0;display:flex;flex-direction:column;gap:12px">

<header style="display:flex;align-items:center;gap:12px">
<dc-import name="HubMark" size="30" color="#4388F5" hint-size="24px,30px"></dc-import>
<div><span class="eb">3 open</span><h1 class="d" style="margin:2px 0 0;font-size:28px;font-weight:600;line-height:1">Tasks</h1></div>
<span class="m" style="margin-left:auto;display:inline-flex;align-items:center;min-height:24px;padding:0 8px;border-radius:6px;background:#3A2E12;color:#F8CB72;font-size:10px;letter-spacing:.1em">SAMPLE ROWS</span>
</header>

<div role="tablist" aria-label="Tasks or notes" style="display:grid;grid-template-columns:1fr 1fr;padding:4px;border-radius:14px;background:#0D1118;box-shadow:inset 0 0 0 1px #222D3D">
<button type="button" role="tab" aria-selected="true" style="min-height:40px;border:0;border-radius:10px;background:#1D355A;box-shadow:inset 0 0 0 1px rgba(67,136,245,.5);color:#F2F5FA;font-family:inherit;font-size:14px;font-weight:600">Tasks · 3</button>
<button type="button" role="tab" aria-selected="false" style="min-height:40px;border:0;border-radius:10px;background:transparent;color:#929EAF;font-family:inherit;font-size:14px;font-weight:500">Notes · 2</button>
</div>

<label style="display:flex;align-items:center;gap:10px;min-height:52px;padding:0 6px 0 14px;border-radius:14px;background:#1A2230;box-shadow:inset 0 0 0 1px #303B4B">
<span style="flex:1;font-size:15px;color:#929EAF">Add a task…</span>
<span class="m" style="display:inline-flex;align-items:center;min-height:30px;padding:0 9px;border-radius:8px;background:#222D3D;font-size:10px;color:#B7C0CD">NO DATE</span>
<span style="display:flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:10px;background:#4388F5;color:#0D1118;font-size:20px;font-weight:600">+</span>
</label>

<section aria-label="Open tasks" class="card" style="padding:4px 14px">
<sc-for list="{{open}}" as="t" hint-placeholder-count="3">
<div style="display:flex;align-items:center;gap:12px;min-height:62px;border-bottom:1px solid #222D3D">
<span role="checkbox" aria-checked="false" style="flex:none;width:22px;height:22px;border-radius:7px;box-shadow:inset 0 0 0 1.5px #4A5668"></span>
<span style="flex:1;min-width:0"><span style="display:block;font-size:15px;font-weight:600">{{t.title}}</span><span class="m" style="display:flex;align-items:center;gap:6px;font-size:10px;letter-spacing:.1em;color:#929EAF"><span style="width:6px;height:6px;border-radius:50%;background:{{t.tag}}"></span>{{t.sub}}</span></span>
<span class="m" style="font-size:10.5px;color:#B7C0CD">{{t.when}}</span>
</div>
</sc-for>
<div style="display:flex;align-items:center;gap:12px;min-height:56px;opacity:.55">
<span role="checkbox" aria-checked="true" style="flex:none;display:flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:7px;background:#3DD68C"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#0D1118" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l4 4 10-10" stroke-dasharray="20" style="animation:tick .4s ease-out both"></path></svg></span>
<span style="position:relative;flex:1;font-size:15px;font-weight:500">Add both meters to the hub<span aria-hidden="true" style="position:absolute;left:0;right:30%;top:50%;height:1.5px;background:#F2F5FA;transform-origin:left;animation:strike .4s .2s ease-out both"></span></span>
<span style="font-size:12px;font-weight:600;color:#4388F5">Undo</span>
</div>
</section>

<span class="eb" style="margin-top:4px">Notes</span>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:start">
<article class="card" style="padding:14px;border-color:rgba(67,136,245,.4)">
<span class="m" style="display:inline-flex;align-items:center;gap:5px;font-size:9.5px;letter-spacing:.12em;color:#4388F5"><span style="width:6px;height:6px;border-radius:50%;background:#4388F5"></span>ELECTRICITY</span>
<p style="margin:6px 0 0;font-size:14px;font-weight:600;line-height:1.3">Meter seal check</p>
<p style="margin:4px 0 0;font-size:13px;line-height:1.45;color:#B7C0CD">The board on the wall is the one with the red reset. Note the seal number next visit.</p>
</article>
<article class="card" style="padding:14px">
<span class="m" style="display:inline-flex;align-items:center;gap:5px;font-size:9.5px;letter-spacing:.12em;color:#929EAF"><span style="width:6px;height:6px;border-radius:50%;background:#929EAF"></span>HOUSE</span>
<p style="margin:6px 0 0;font-size:14px;font-weight:600;line-height:1.3">Spare keys</p>
<p style="margin:4px 0 0;font-size:13px;line-height:1.45;color:#B7C0CD">Second drawer.</p>
</article>
</div>
</div>

<div style="position:absolute;left:0;right:0;bottom:0"><dc-import name="HubNav" active="more" hint-size="390px,84px"></dc-import></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":900}}'>
class Component extends DCLogic {
renderVals() {
return {
open: [
{ title: 'Ask the CEB for a second meter seal', sub: 'ELECTRICITY', tag: '#4388F5', when: 'FRI 20' },
{ title: 'Find the Premio revenue licence', sub: 'VEHICLES', tag: '#B7C0CD', when: '' },
{ title: 'Change the porch bulb', sub: 'HOUSE', tag: '#929EAF', when: '' },
],
};
}
}
</script>
</body>
</html>
