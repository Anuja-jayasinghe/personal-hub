<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>hub Read the meters</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Oxanium:wght@400;500;600;700&family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Sora',Arial,sans-serif;color:#F2F5FA}
.d{font-family:'Oxanium',Arial,sans-serif;letter-spacing:-.025em}
.m{font-family:'JetBrains Mono',monospace}
.chip{display:inline-flex;align-items:center;min-height:36px;padding:0 12px;border-radius:999px;font-size:13px;font-weight:500}
@keyframes caret{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes sheetUp{from{transform:translateY(40px);opacity:.6}to{transform:translateY(0);opacity:1}}
</style>
</helmet>
<div style="position:relative;width:390px;height:844px;background:#11151D;overflow:hidden">
<div aria-hidden="true" style="padding:18px 16px;display:flex;flex-direction:column;gap:12px">
<div style="display:flex;align-items:center;gap:12px"><span style="width:24px;height:30px;border-radius:6px;background:#1D355A"></span><span class="d" style="font-size:28px;font-weight:600">Electricity</span></div>
<div style="height:250px;border-radius:24px;background:#0D1118;border:1px solid #222D3D"></div>
<div style="height:70px;border-radius:18px;background:#1A2230"></div>
</div>
<div style="position:absolute;inset:0;background:rgba(5,7,11,.66);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)"></div>

<section role="dialog" aria-modal="true" aria-labelledby="sheetTitle" style="position:absolute;left:0;right:0;bottom:0;background:#1A2230;border-top:1px solid #303B4B;border-radius:28px 28px 0 0;padding:10px 16px 28px;display:flex;flex-direction:column;gap:14px;animation:sheetUp .35s cubic-bezier(.2,.8,.2,1)">
<span aria-hidden="true" style="align-self:center;width:40px;height:5px;border-radius:3px;background:#303B4B"></span>
<div style="display:flex;align-items:center;gap:10px">
<div><span class="m" style="display:block;font-size:10.5px;letter-spacing:.14em;color:#4388F5">/ ELECTRICITY / NEW READING</span><h2 id="sheetTitle" class="d" style="margin:2px 0 0;font-size:26px;font-weight:600">Read the meters</h2></div>
<button type="button" aria-label="Close" style="margin-left:auto;width:40px;height:40px;border:0;border-radius:12px;background:#222D3D;box-shadow:inset 0 0 0 1px #303B4B;color:#F2F5FA;font-size:18px">×</button>
</div>
<p style="margin:-6px 0 0;font-size:14px;line-height:1.5;color:#A3ADBD">Type what each dial shows. Leave one blank if you only read one.</p>

<sc-for list="{{fields}}" as="f" hint-placeholder-count="2">
<label style="display:flex;flex-direction:column;gap:8px;padding:14px;border-radius:18px;background:#11151D;box-shadow:inset 0 0 0 {{f.ringW}} {{f.ring}}">
<span style="display:flex;align-items:center;gap:8px">
<span class="m" style="display:inline-flex;align-items:center;justify-content:center;width:24px;height:20px;border-radius:6px;background:#222D3D;box-shadow:inset 0 0 0 1px #303B4B;font-size:11px;font-weight:600">{{f.letter}}</span>
<span style="font-size:15px;font-weight:600">{{f.name}}</span>
<span class="m" style="margin-left:auto;font-size:11px;color:#929EAF">last {{f.last}} · {{f.lastDate}}</span>
</span>
<span style="display:flex;align-items:center;gap:4px" aria-label="{{f.name}} reading, {{f.typed}}">
<sc-for list="{{f.cells}}" as="c" hint-placeholder-count="5"><span class="m" style="width:44px;height:56px;border-radius:10px;background:{{c.bg}};box-shadow:inset 0 0 0 1px {{c.ring}};color:{{c.ink}};font-size:28px;font-weight:600;line-height:56px;text-align:center">{{c.d}}</span></sc-for>
<span style="width:2px;height:30px;margin-left:4px;background:#4388F5;opacity:{{f.caret}};animation:caret 1s steps(1) infinite"></span>
<span class="m" style="margin-left:auto;font-size:11px;color:#929EAF">kWh</span>
</span>
<span style="display:flex;align-items:center;gap:8px;font-size:13px;font-weight:500;color:{{f.msgInk}}"><span style="width:7px;height:7px;border-radius:50%;background:{{f.dot}}"></span>{{f.msg}}</span>
</label>
</sc-for>

<div style="display:flex;align-items:center;gap:8px">
<span class="m" style="font-size:11px;color:#929EAF">READ ON</span>
<span class="chip" style="background:#1D355A;color:#F2F5FA;box-shadow:inset 0 0 0 1px rgba(67,136,245,.5)">Today, 18 Nov</span>
<span class="chip" style="box-shadow:inset 0 0 0 1px #303B4B;color:#B7C0CD">Yesterday</span>
<span class="chip" style="box-shadow:inset 0 0 0 1px #303B4B;color:#B7C0CD">Pick…</span>
</div>

<button type="button" aria-disabled="true" style="min-height:56px;border:0;border-radius:14px;background:#222D3D;color:#929EAF;font-family:inherit;font-size:16px;font-weight:600;box-shadow:inset 0 0 0 1px #303B4B">Fix Meter B to save</button>
<p class="m" style="margin:-6px 0 0;text-align:center;font-size:10.5px;color:#929EAF">SAVING UPDATES BOTH SLAB RULES AT ONCE</p>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const cells = (s, bad) => s.split('').map((d, i, a) => {
const last = i === a.length - 1;
if (bad) return { d, bg: '#3D1C1E', ring: 'rgba(255,107,97,.5)', ink: '#FF8F87' };
return { d, bg: last ? '#4388F5' : '#222D3D', ring: last ? '#4388F5' : '#303B4B', ink: last ? '#0D1118' : '#F2F5FA' };
});
return {
fields: [
{ name: 'Meter A', letter: 'A', last: '17,465', lastDate: '15 NOV', typed: '17,489', cells: cells('17489', false), caret: 0, ring: '#303B4B', ringW: '1px', msg: '+24 kWh since 15 Nov. 96 left before 120.', msgInk: '#5EE0A5', dot: '#3DD68C' },
{ name: 'Meter B', letter: 'B', last: '37,429', lastDate: '16 NOV', typed: '37,249', cells: cells('37249', true), caret: 1, ring: '#FF6B61', ringW: '1.5px', msg: 'Lower than the last reading, 37,429. Check the digits.', msgInk: '#FF8F87', dot: '#FF6B61' },
],
};
}
}
</script>
</body>
</html>
