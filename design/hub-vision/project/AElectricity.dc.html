<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Switchboard Electricity</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=Martian+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Archivo',system-ui,sans-serif;color:#16181D}
@keyframes discMark{0%{transform:translateX(-30px) scaleX(.25);opacity:.35}25%{transform:translateX(0) scaleX(1);opacity:1}50%{transform:translateX(30px) scaleX(.25);opacity:.35}50.1%,100%{opacity:0}}
@keyframes led{0%,100%{opacity:1}50%{opacity:.45}}
</style>
</helmet>
<div style="position:relative;width:390px;height:844px;box-sizing:border-box;background:#ECEEF1;overflow:hidden">
<div style="padding:20px 16px 0;display:flex;flex-direction:column;gap:12px">

<header style="display:flex;align-items:center;gap:10px">
<svg width="34" height="34" viewBox="0 0 120 120" aria-hidden="true"><rect x="2" y="2" width="116" height="116" rx="28" fill="#16181D"></rect><path d="M26 72 V 50 L 56 26 L 86 50 V 72 H 22" fill="none" stroke="#F2F3F5" stroke-width="9" stroke-linejoin="round" stroke-linecap="round"></path><path d="M66 56 V 90 C 66 99 59 102 51 99" fill="none" stroke="#F2F3F5" stroke-width="9" stroke-linecap="round"></path><circle cx="66" cy="42" r="7" fill="#D2392C"></circle></svg>
<h1 style="margin:0;font-size:24px;font-weight:800;font-stretch:125%;letter-spacing:-0.02em">Electricity</h1>
<span style="margin-left:auto;font-family:'Martian Mono',monospace;font-size:11px;color:#4B515C">day 12 of 30</span>
</header>

<section aria-label="The meter board" style="background:#16181D;border-radius:22px;padding:14px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px">
<sc-for list="{{meters}}" as="m" hint-placeholder-count="2">
<a href="#" style="display:flex;flex-direction:column;align-items:center;gap:9px;padding:12px 8px;border-radius:16px;background:#20242B;text-decoration:none;color:#F2F3F5;box-shadow:inset 0 0 0 1px {{m.ring}}">
<span style="display:flex;width:100%;align-items:center;justify-content:space-between;padding:0 4px;box-sizing:border-box"><span style="display:inline-flex;align-items:center;justify-content:center;width:24px;height:18px;border-radius:4px;background:#F2F3F5;color:#16181D;font-family:'Martian Mono',monospace;font-size:11px;font-weight:600">{{m.letter}}</span><span style="display:flex;align-items:center;gap:5px;font-size:11px;color:#C9CED6"><span style="width:7px;height:7px;border-radius:50%;background:{{m.led}};animation:{{m.blink}}"></span>{{m.state}}</span></span>
<span style="display:flex;gap:2px" role="img" aria-label="Reading {{m.reading}}">
<sc-for list="{{m.digits}}" as="g" hint-placeholder-count="5"><span style="width:17px;height:25px;border-radius:4px;background:#F2F3F5;color:#16181D;font-family:'Martian Mono',monospace;font-size:14px;font-weight:600;line-height:25px;text-align:center">{{g}}</span></sc-for>
<span style="width:17px;height:25px;border-radius:4px;background:#D2392C;color:#FFFFFF;font-family:'Martian Mono',monospace;font-size:14px;font-weight:600;line-height:25px;text-align:center">0</span>
</span>
<span style="position:relative;width:110px;height:26px">
<span style="position:absolute;inset:0;border-radius:50%;background:#C9CED6;box-shadow:inset 0 -3px 0 #9AA1AC"></span>
<span style="position:absolute;left:51px;top:9px;width:7px;height:8px;border-radius:2px;background:#D2392C;animation:{{m.disc}}"></span>
<span style="position:absolute;left:51px;top:9px;width:7px;height:8px;border-radius:2px;background:#D2392C;opacity:{{m.markB}};animation:{{m.disc2}}"></span>
</span>
<span style="font-size:11px;color:{{m.checkColor}}">{{m.checked}}</span>
</a>
</sc-for>
</section>

<sc-for list="{{meters}}" as="m" hint-placeholder-count="2">
<section aria-label="{{m.name}} against its limit" style="background:#F8F9FA;border-radius:18px;padding:12px 14px;box-shadow:0 0 0 1px rgba(22,24,29,.1)">
<div style="display:flex;align-items:baseline;gap:8px">
<span style="font-size:14px;font-weight:700">{{m.name}}</span>
<span style="font-size:12px;color:#4B515C">{{m.role}}</span>
<span style="margin-left:auto;font-size:30px;font-weight:800;font-stretch:125%;line-height:1">{{m.left}}</span>
<span style="font-size:12px;color:#4B515C">to {{m.limit}}</span>
</div>
<div style="position:relative;height:30px;margin-top:6px" role="img" aria-label="{{m.used}} of {{m.limit}} used">
<div style="position:absolute;left:0;right:0;top:12px;height:8px;border-radius:3px;background:#DDE0E5"></div>
<div style="position:absolute;left:60%;width:30%;top:12px;height:8px;background:#F8DFA8"></div>
<div style="position:absolute;left:90%;right:0;top:12px;height:8px;border-radius:0 3px 3px 0;background:#F2C1BB"></div>
<div style="position:absolute;left:0;width:{{m.pct}}%;top:12px;height:8px;border-radius:3px 0 0 3px;background:#16181D"></div>
<div style="position:absolute;left:calc({{m.pct}}% - 6px);top:0;width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;border-top:10px solid #D2392C"></div>
<span style="position:absolute;left:60%;top:21px;font-family:'Martian Mono',monospace;font-size:9px;color:#4B515C">120</span>
<span style="position:absolute;left:88%;top:21px;font-family:'Martian Mono',monospace;font-size:9px;color:#4B515C">180</span>
</div>
</section>
</sc-for>

<section aria-label="Room before a price jump" style="background:#F8F9FA;border-radius:18px;padding:12px 14px;box-shadow:0 0 0 1px rgba(22,24,29,.1)">
<div style="display:flex;align-items:baseline;gap:8px"><span style="font-size:34px;font-weight:800;font-stretch:125%;line-height:1">189</span><span style="font-size:13px;color:#2C3038">units before a price jump</span></div>
<p style="margin:6px 0 0;display:flex;align-items:center;gap:6px;font-size:13px;color:#2C3038"><span style="width:8px;height:8px;border-radius:50%;background:#1FA971"></span>On pace for about 283 this cycle. That fits in 300.</p>
</section>

<p style="margin:0;display:flex;align-items:center;gap:8px;font-size:13px;color:#8A5A00"><span style="width:8px;height:8px;border-radius:50%;background:#F2A417"></span>Meter A was last read 6 days ago.</p>

<a href="#" style="display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;border-radius:16px;background:#16181D;color:#F2F3F5;font-size:16px;font-weight:700;font-stretch:112%;text-decoration:none">Read the meters</a>
</div>

<nav aria-label="Main" style="position:absolute;left:0;right:0;bottom:0;height:78px;box-sizing:border-box;padding:6px 18px 18px;background:#F8F9FA;box-shadow:0 -1px 0 rgba(22,24,29,.1);display:flex;justify-content:space-between;align-items:center">
<sc-for list="{{nav}}" as="n" hint-placeholder-count="5">
<a href="#" aria-label="{{n.label}}" aria-current="{{n.current}}" style="position:relative;display:block;width:52px;height:52px;border-radius:16px;background:{{n.bg}}">
<span style="position:absolute;right:7px;top:6px;width:24px;height:24px;border-radius:{{n.shape}};background:linear-gradient(140deg,{{n.c1}},{{n.c2}})"></span>
<span style="position:absolute;left:7px;bottom:7px;width:32px;height:32px;border-radius:11px;background:rgba(255,255,255,.4);border:1px solid rgba(255,255,255,.9);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 6px 12px -8px rgba(22,24,29,.5);display:flex;align-items:center;justify-content:center"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#16181D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{n.d}}"></path></svg></span>
</a>
</sc-for>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const nav = [
{ label: 'Home', d: 'M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z', c1: '#FF9A6B', c2: '#E5532E', shape: '50%' },
{ label: 'Vehicles', d: 'M3 15h18v3H3zM6 15l1.8-5a2 2 0 0 1 1.9-1.3h4.6a2 2 0 0 1 1.9 1.3L18 15', c1: '#7BB2FF', c2: '#2F5BFF', shape: '50% 50% 8px 8px' },
{ label: 'Electricity', d: 'M13 2L5 13h6l-1 8 8-11h-6z', c1: '#FFD54A', c2: '#E8930C', shape: '8px', on: true },
{ label: 'Bills', d: 'M6 3h12v16l-3-2-3 2-3-2-3 2zM9 8h6M9 12h6', c1: '#6FE7AE', c2: '#16935E', shape: '8px' },
{ label: 'More', d: 'M5 12h.01M12 12h.01M19 12h.01', c1: '#D5DAE1', c2: '#7A818C', shape: '50%' },
];
return {
nav: nav.map((n) => ({ ...n, bg: n.on ? '#E3E6EA' : 'transparent', current: n.on ? 'page' : 'false' })),
meters: [
{ name: 'Meter A', letter: 'A', role: 'under 120', state: 'idle', led: '#3A3F48', blink: 'none', ring: 'transparent', reading: '17,489', digits: ['1', '7', '4', '8', '9'], disc: 'none', disc2: 'none', markB: 0, checked: 'read 6 days ago', checkColor: '#F2A417', left: '96', limit: '120', used: '24', pct: 12 },
{ name: 'Meter B', letter: 'B', role: 'under 120 · live', state: 'live', led: '#1FA971', blink: 'led 2s ease-in-out infinite', ring: 'rgba(210,57,44,.6)', reading: '37,429', digits: ['3', '7', '4', '2', '9'], disc: 'discMark 1.6s linear infinite', disc2: 'discMark 1.6s linear -0.8s infinite', markB: 1, checked: 'read today', checkColor: '#C9CED6', left: '33', limit: '120', used: '87', pct: 43.5 },
],
};
}
}
</script>
</body>
</html>
