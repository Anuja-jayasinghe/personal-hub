<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>hub phone bar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600&display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<nav aria-label="Main" style="width:390px;height:84px;box-sizing:border-box;padding:8px 10px 20px;background:{{bar}};backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid {{line}};display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-items:center">
<sc-for list="{{items}}" as="n" hint-placeholder-count="5">
<a href="#" aria-label="{{n.label}}" aria-current="{{n.current}}" style="display:flex;flex-direction:column;align-items:center;gap:3px;text-decoration:none">
<span style="display:flex;align-items:center;justify-content:center;width:52px;height:32px;border-radius:12px;background:{{n.bg}};box-shadow:inset 0 0 0 1px {{n.ring}}">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{n.ink}}" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{n.d}}"></path><sc-for list="{{n.nodes}}" as="p" hint-placeholder-count="2"><circle cx="{{p.x}}" cy="{{p.y}}" r="1.9" fill="{{n.ink}}" stroke="none"></circle></sc-for></svg>
</span>
<span style="font-family:'Sora',Arial,sans-serif;font-size:10.5px;font-weight:{{n.weight}};color:{{n.text}}">{{n.label}}</span>
</a>
</sc-for>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","default":"home","options":["home","vehicles","electricity","bills","more"]},"light":{"editor":"boolean","default":false},"$preview":{"width":390,"height":84}}'>
class Component extends DCLogic {
renderVals() {
const active = this.props.active ?? 'home';
const light = this.props.light === true || this.props.light === 'true';
const P = (pts) => pts.map(([x, y]) => ({ x, y }));
const defs = [
{ key: 'home', label: 'Home', d: 'M4 11l8-7 8 7M6 9.5V20h12V9.5', nodes: P([[12, 4], [4, 11], [20, 11]]) },
{ key: 'vehicles', label: 'Vehicles', d: 'M3 16h18M5.5 16l2-5.5h9l2 5.5', nodes: P([[7.5, 19], [16.5, 19]]) },
{ key: 'electricity', label: 'Electricity', d: 'M13 3L6 13h6l-1 8 7-10h-6z', nodes: P([[13, 3], [11, 21]]) },
{ key: 'bills', label: 'Bills', d: 'M7 3h10v18l-2.5-1.5L12 21l-2.5-1.5L7 21zM10 8h4M10 12h4', nodes: P([[7, 3], [17, 3]]) },
{ key: 'more', label: 'More', d: 'M5 12h14M12 5v14', nodes: P([[5, 12], [19, 12], [12, 5], [12, 19]]) },
];
const blue = light ? '#2869D8' : '#4388F5';
return {
bar: light ? 'rgba(248,250,252,.92)' : 'rgba(13,17,24,.9)',
line: light ? '#D5DBE4' : '#303B4B',
items: defs.map((n) => {
const on = n.key === active;
return { ...n, current: on ? 'page' : 'false', bg: on ? (light ? '#DCE8FD' : '#1D355A') : 'transparent', ring: on ? (light ? 'rgba(40,105,216,.35)' : 'rgba(67,136,245,.45)') : 'transparent', ink: on ? blue : (light ? '#687386' : '#929EAF'), text: on ? (light ? '#171D29' : '#F2F5FA') : (light ? '#687386' : '#929EAF'), weight: on ? 600 : 500 };
}),
};
}
}
</script>
</body>
</html>
