<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Home on the phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=Martian+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Archivo',system-ui,sans-serif;color:#16181D}
@keyframes flow{to{stroke-dashoffset:-26}}
@keyframes led{0%,100%{opacity:1}50%{opacity:.4}}
</style>
</helmet>
<div style="position:relative;width:390px;height:1000px;background:#ECEEF1;overflow:hidden">
<div style="padding:20px 16px 0;display:flex;flex-direction:column;gap:12px">

<header style="display:flex;align-items:center;gap:10px">
<svg width="34" height="34" viewBox="0 0 120 120" aria-hidden="true"><rect x="2" y="2" width="116" height="116" rx="28" fill="#16181D"></rect><path d="M26 72 V 50 L 56 26 L 86 50 V 72 H 22" fill="none" stroke="#F2F3F5" stroke-width="9" stroke-linejoin="round" stroke-linecap="round"></path><path d="M66 56 V 90 C 66 99 59 102 51 99" fill="none" stroke="#F2F3F5" stroke-width="9" stroke-linecap="round"></path><circle cx="66" cy="42" r="7" fill="#D2392C"></circle></svg>
<span><span style="display:block;font-size:12px;color:#4B515C">Wed 18 Nov · day 13 of 30</span><h1 style="margin:0;font-size:24px;font-weight:800;font-stretch:125%;letter-spacing:-0.02em;line-height:1.1">Evening, Anuja</h1></span>
<span aria-label="Signed in" style="margin-left:auto;width:36px;height:36px;border-radius:50%;background:linear-gradient(140deg,#FF9A6B,#E5532E);box-shadow:inset 0 0 0 2px rgba(255,255,255,.6)"></span>
</header>

<section aria-label="The house" style="position:relative;height:300px;background:#F8F9FA;border-radius:24px;overflow:hidden;box-shadow:0 0 0 1px rgba(22,24,29,.1)">
<svg width="100%" height="100%" viewBox="90 80 640 360" preserveAspectRatio="xMidYMid slice" role="img" aria-label="The house: the meter board with Meter B live, the garage with two vehicles, the letterbox with two bills">
<ellipse cx="380" cy="352" rx="250" ry="58" fill="#E3E6EA"></ellipse>
<polygon points="200,330 110,278 110,214 200,266" fill="#DDE0E5" stroke="#16181D" stroke-width="2"></polygon>
<polygon points="200,330 262,294 262,230 200,266" fill="#F2F3F5" stroke="#16181D" stroke-width="2"></polygon>
<polygon points="200,266 110,214 172,178 262,230" fill="#C9CED6" stroke="#16181D" stroke-width="2"></polygon>
<polygon points="210,320 252,296 252,254 210,278" fill="#16181D"></polygon>
<path d="M216 304 l8 -4 l4 -6 l10 -6 l6 2 l6 -2 v6 l-34 20 z" fill="#8A909A"></path>
<polygon points="390,372 262,298 262,190 390,264" fill="#DDE0E5" stroke="#16181D" stroke-width="2"></polygon>
<polygon points="390,372 540,285 540,177 390,264" fill="#F8F9FA" stroke="#16181D" stroke-width="2"></polygon>
<polygon points="390,264 262,190 412,103 540,177" fill="#C9CED6" stroke="#16181D" stroke-width="2"></polygon>
<polygon points="292,280 330,302 330,262 292,240" fill="#F8DFA8" stroke="#16181D" stroke-width="1.5"></polygon>
<polygon points="300,229 340,252 340,224 300,201" fill="#2A2E35" stroke="#16181D" stroke-width="1.5"></polygon>
<polygon points="470,270 512,246 512,206 470,230" fill="#F8DFA8" stroke="#16181D" stroke-width="1.5"></polygon>
<polygon points="404,300 452,272 452,226 404,254" fill="#16181D"></polygon>
<rect x="0" y="0" width="12" height="16" rx="2" fill="#F2F3F5" transform="translate(412 262) skewY(-30)"></rect>
<rect x="0" y="0" width="12" height="16" rx="2" fill="#F2F3F5" transform="translate(432 250) skewY(-30)"></rect>
<circle cx="418" cy="290" r="3" fill="#3A3F48"></circle>
<circle cx="438" cy="279" r="3.5" fill="#1FA971" style="animation:led 2s ease-in-out infinite"></circle>
<line x1="680" y1="300" x2="680" y2="118" stroke="#16181D" stroke-width="5" stroke-linecap="round"></line>
<line x1="660" y1="132" x2="700" y2="122" stroke="#16181D" stroke-width="4" stroke-linecap="round"></line>
<path d="M664 134 C 600 170 520 200 446 238" fill="none" stroke="#B5713A" stroke-width="3"></path>
<path d="M664 134 C 600 170 520 200 446 238" fill="none" stroke="#F2A417" stroke-width="3.5" stroke-dasharray="2 24" stroke-linecap="round" style="animation:flow .9s linear infinite"></path>
<line x1="600" y1="380" x2="600" y2="344" stroke="#16181D" stroke-width="3"></line>
<polygon points="586,344 614,328 614,310 586,326" fill="#D2392C" stroke="#16181D" stroke-width="1.5"></polygon>
<polygon points="586,326 572,318 600,302 614,310" fill="#E3594C" stroke="#16181D" stroke-width="1.5"></polygon>
</svg>
<a href="#" style="position:absolute;left:52%;top:10px;display:flex;flex-direction:column;padding:8px 10px;border-radius:12px;background:#16181D;color:#F2F3F5;text-decoration:none;box-shadow:0 10px 20px -10px rgba(0,0,0,.5)">
<span style="display:flex;align-items:center;gap:5px;font-size:11px;color:#C9CED6"><span style="width:6px;height:6px;border-radius:50%;background:#1FA971"></span>B live</span>
<span style="font-size:20px;font-weight:800;font-stretch:125%;line-height:1.1">33 <span style="font-size:11px;font-weight:600;font-stretch:100%;color:#C9CED6">to 120</span></span>
</a>
<a href="#" style="position:absolute;left:10px;top:44px;display:flex;flex-direction:column;padding:8px 10px;border-radius:12px;background:rgba(248,249,250,.86);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);color:#16181D;text-decoration:none;box-shadow:0 0 0 1px rgba(22,24,29,.12)">
<span style="font-size:11px;color:#4B515C">Garage</span><span style="font-size:13px;font-weight:700">2 vehicles</span>
</a>
<a href="#" style="position:absolute;right:10px;bottom:12px;display:flex;flex-direction:column;padding:8px 10px;border-radius:12px;background:rgba(248,249,250,.86);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);color:#16181D;text-decoration:none;box-shadow:0 0 0 1px rgba(22,24,29,.12)">
<span style="display:flex;align-items:center;gap:5px;font-size:11px;color:#4B515C"><span style="width:6px;height:6px;border-radius:50%;background:#F2A417"></span>Letterbox</span><span style="font-size:13px;font-weight:700">2 bills · 4 Dec</span>
</a>
</section>

<a href="#" style="display:flex;align-items:center;justify-content:center;gap:10px;min-height:56px;border-radius:16px;background:#16181D;color:#F2F3F5;font-size:16px;font-weight:700;font-stretch:112%;text-decoration:none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFD54A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 2L5 13h6l-1 8 8-11h-6z"></path></svg>Read the meters</a>

<section aria-label="Needs you next" style="background:#F8F9FA;border-radius:22px;padding:6px 14px;box-shadow:0 0 0 1px rgba(22,24,29,.1)">
<h2 style="margin:8px 0 2px;font-size:15px;font-weight:700">Needs you next</h2>
<sc-for list="{{todo}}" as="t" hint-placeholder-count="3">
<a href="#" style="display:flex;align-items:center;gap:12px;min-height:60px;border-top:1px solid #E3E6EA;text-decoration:none;color:#16181D">
<span style="width:10px;height:10px;border-radius:50%;background:{{t.lamp}};flex:0 0 10px"></span>
<span style="flex:1;min-width:0"><span style="display:block;font-size:15px;font-weight:700">{{t.title}}</span><span style="display:block;font-size:12px;color:#4B515C">{{t.sub}}</span></span>
<span style="font-family:'Martian Mono',monospace;font-size:11px;color:#2C3038">{{t.when}}</span>
</a>
</sc-for>
</section>

<div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px">
<sc-for list="{{tiles}}" as="m" hint-placeholder-count="4">
<a href="#" style="display:flex;flex-direction:column;gap:4px;padding:14px;border-radius:18px;background:#F8F9FA;text-decoration:none;color:#16181D;box-shadow:0 0 0 1px rgba(22,24,29,.1)">
<span style="display:flex;align-items:center;gap:8px;font-size:12px;color:#4B515C"><span style="position:relative;width:22px;height:22px"><span style="position:absolute;right:0;top:0;width:14px;height:14px;border-radius:{{m.shape}};background:linear-gradient(140deg,{{m.c1}},{{m.c2}})"></span><span style="position:absolute;left:0;bottom:0;width:16px;height:16px;border-radius:6px;background:rgba(255,255,255,.5);border:1px solid rgba(255,255,255,.9);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)"></span></span>{{m.name}}</span>
<span style="font-size:26px;font-weight:800;font-stretch:125%;line-height:1">{{m.big}}</span>
<span style="font-size:12px;color:#2C3038">{{m.sub}}</span>
</a>
</sc-for>
</div>
</div>

<div style="position:absolute;left:0;right:0;bottom:0"><dc-import name="GlassNav" active="home" hint-size="390px,78px"></dc-import></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1000}}'>
class Component extends DCLogic {
renderVals() {
return {
todo: [
{ title: 'Pay 2 electricity bills', sub: 'LKR 7,913.84 in total', when: '4 Dec', lamp: '#F2A417' },
{ title: 'Read Meter A', sub: 'last read 3 days ago', when: 'soon', lamp: '#F2A417' },
{ title: 'Meter B nears 120', sub: 'about 5 days at this pace', when: 'watch', lamp: '#1FA971' },
],
tiles: [
{ name: 'Electricity', big: '189', sub: 'units before a price jump', c1: '#FFD54A', c2: '#E8930C', shape: '4px' },
{ name: 'Bills', big: '7,913', sub: 'LKR to pay by 4 Dec', c1: '#6FE7AE', c2: '#16935E', shape: '4px' },
{ name: 'Vehicles', big: '2', sub: 'no renewals added yet', c1: '#7BB2FF', c2: '#2F5BFF', shape: '50% 50% 4px 4px' },
{ name: 'Documents', big: '0', sub: 'add the vehicle books', c1: '#C2B4FF', c2: '#6C4CF0', shape: '4px 8px' },
],
};
}
}
</script>
</body>
</html>
