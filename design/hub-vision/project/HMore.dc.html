<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>hub More</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Oxanium:wght@400;500;600;700&family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Sora',Arial,sans-serif;color:#F2F5FA}
.d{font-family:'Oxanium',Arial,sans-serif;letter-spacing:-.025em}
.m{font-family:'JetBrains Mono',monospace}
.eb{font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:#929EAF}
.card{background:#1A2230;border:1px solid #303B4B;border-radius:18px}
.tile{display:flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:12px;background:rgba(34,45,61,.7);box-shadow:inset 0 0 0 1px #303B4B,inset 0 1px 0 rgba(255,255,255,.06)}
</style>
</helmet>
<div style="position:relative;width:390px;height:900px;background:#11151D;overflow:hidden">
<div style="padding:18px 16px 0;display:flex;flex-direction:column;gap:12px">

<header style="display:flex;align-items:center;gap:12px">
<dc-import name="HubMark" size="30" color="#4388F5" hint-size="24px,30px"></dc-import>
<h1 class="d" style="margin:0;font-size:28px;font-weight:600;line-height:1">More</h1>
</header>

<a href="#" class="card" style="display:flex;align-items:center;gap:12px;padding:14px;text-decoration:none;color:#F2F5FA">
<span style="flex:none;display:flex;align-items:center;justify-content:center;width:46px;height:46px;border-radius:50%;background:#1D355A;box-shadow:inset 0 0 0 1px rgba(67,136,245,.55);font-size:17px;font-weight:600">A</span>
<span style="flex:1"><span style="display:block;font-size:16px;font-weight:600">Anuja</span><span class="m" style="display:block;font-size:10.5px;letter-spacing:.1em;color:#4388F5">OWNER</span></span>
<span style="font-size:13px;font-weight:600;color:#4388F5">Profile</span>
</a>

<label style="display:flex;align-items:center;gap:10px;min-height:48px;padding:0 14px;border-radius:12px;background:#1A2230;box-shadow:inset 0 0 0 1px #303B4B"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#929EAF" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg><span style="font-size:15px;color:#929EAF">Search the hub</span><span class="m" style="margin-left:auto;font-size:10px;color:#4A5668">READINGS, BILLS, DOCS</span></label>

<div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px">
<sc-for list="{{parts}}" as="p" hint-placeholder-count="6">
<a href="#" class="card" style="display:flex;flex-direction:column;gap:10px;padding:14px;text-decoration:none;color:{{p.ink}};border-style:{{p.border}}">
<span class="tile"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{p.icon}}" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{p.d}}"></path><sc-for list="{{p.nodes}}" as="n" hint-placeholder-count="2"><circle cx="{{n.x}}" cy="{{n.y}}" r="1.9" fill="{{p.icon}}" stroke="none"></circle></sc-for></svg></span>
<span><span style="display:block;font-size:15px;font-weight:600">{{p.name}}</span><span class="m" style="display:block;margin-top:2px;font-size:10px;letter-spacing:.08em;color:{{p.metaInk}}">{{p.meta}}</span></span>
</a>
</sc-for>
</div>

<section aria-label="Settings and help" class="card" style="padding:4px 14px">
<sc-for list="{{links}}" as="l" hint-placeholder-count="5">
<a href="#" style="display:flex;align-items:center;gap:12px;min-height:52px;border-top:{{l.line}};text-decoration:none;color:#F2F5FA">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#B7C0CD" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{l.d}}"></path></svg>
<span style="flex:1;font-size:14px;font-weight:500">{{l.label}}</span>
<span class="m" style="font-size:10px;letter-spacing:.08em;color:#929EAF">{{l.meta}}</span>
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#4A5668" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg>
</a>
</sc-for>
</section>
<a href="#" style="display:flex;align-items:center;justify-content:center;min-height:46px;border-radius:12px;box-shadow:inset 0 0 0 1px #303B4B;color:#FF8F87;font-size:14px;font-weight:600;text-decoration:none">Sign out</a>
</div>

<div style="position:absolute;left:0;right:0;bottom:0"><dc-import name="HubNav" active="more" hint-size="390px,84px"></dc-import></div>
</div>
</x-dc>

{ name: 'Documents', meta: 'NONE YET', d: 'M6 3h8l4 4v14H6zM14 3v4h4', nodes: P([[14, 3], [18, 7]]), ...live },
{ name: 'Warranties', meta: 'OFF · TURN ON IN SETTINGS', d: 'M12 3l7 3v5c0 5-3 8-7 10-4-2-7-5-7-10V6z', nodes: P([[12, 3]]), ink: '#929EAF', icon: '#4A5668', metaInk: '#4A5668', border: 'dashed' },
{ name: 'Activity', meta: '6 THIS WEEK', d: 'M6 4v16M6 8h12M6 14h9', nodes: P([[6, 4], [6, 20]]), ...live },
],
links: [
{ label: 'Settings', meta: '', d: 'M12 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6zM12 3v4M12 17v4M3 12h4M17 12h4', line: '0' },
{ label: 'People and roles', meta: 'OWNER', d: 'M9 11a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM3 20c0-3 3-5 6-5s6 2 6 5M16 11a3 3 0 1 0 0-6M18 15c2 .5 3 2.5 3 5', line: '1px solid #222D3D' },

],
};
}
}
</script>
</body>
</html>
