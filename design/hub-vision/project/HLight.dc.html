<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>hub Electricity light</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Oxanium:wght@400;500;600;700&family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Sora',Arial,sans-serif;color:#171D29}
.d{font-family:'Oxanium',Arial,sans-serif;letter-spacing:-.025em}
.m{font-family:'JetBrains Mono',monospace}
.eb{font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:#687386}
.card{background:#FFFFFF;border:1px solid #D5DBE4;border-radius:18px}
@keyframes flow{to{stroke-dashoffset:-20}}
@keyframes disc{0%{transform:translateX(-26px) scaleX(.3);opacity:.3}25%{transform:translateX(0) scaleX(1);opacity:1}50%{transform:translateX(26px) scaleX(.3);opacity:.3}50.1%,100%{opacity:0}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
</style>
</helmet>
<div style="position:relative;width:390px;height:844px;background:#ECF0F5;overflow:hidden">
<div style="padding:18px 16px 0;display:flex;flex-direction:column;gap:12px">

<header style="display:flex;align-items:center;gap:12px">
<dc-import name="HubMark" size="30" color="#2869D8" hint-size="24px,30px"></dc-import>
<div><span class="eb">Wed 18 Nov · day 13/30</span><h1 class="d" style="margin:2px 0 0;font-size:28px;font-weight:600;line-height:1">Electricity</h1></div>
<a href="#" style="margin-left:auto;display:flex;align-items:center;min-height:40px;padding:0 14px;border-radius:12px;box-shadow:inset 0 0 0 1px #C5CDD8;color:#171D29;font-size:14px;font-weight:600;text-decoration:none">+ Bill</a>
</header>

<section aria-label="The meter board" style="background:#FFFFFF;border:1px solid #D5DBE4;border-radius:24px;padding:10px 12px 12px;background-image:radial-gradient(#E3E8EF 1px,transparent 1px);background-size:14px 14px">
<svg width="100%" height="40" viewBox="0 0 332 40" aria-hidden="true" style="display:block">
<path d="M166 10V22H82V40" fill="none" stroke="#C5CDD8" stroke-width="2"></path>
<path d="M166 10V22H250V40" fill="none" stroke="#2869D8" stroke-width="2"></path>
<path d="M166 10V22H250V40" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-dasharray="2 18" stroke-linecap="round" style="animation:flow .8s linear infinite"></path>
<circle cx="166" cy="9" r="5" fill="#2869D8"></circle>
<text x="176" y="13" font-family="JetBrains Mono, monospace" font-size="9" letter-spacing="1.2" fill="#687386">GRID</text>
</svg>
<div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px">
<sc-for list="{{meters}}" as="m" hint-placeholder-count="2">
<a href="#" style="display:flex;flex-direction:column;align-items:center;gap:10px;padding:12px 8px;border-radius:16px;background:#F5F7FA;text-decoration:none;color:#171D29;box-shadow:inset 0 0 0 1px {{m.ring}}">
<span style="display:flex;width:100%;align-items:center;justify-content:space-between;padding:0 4px;box-sizing:border-box"><span class="m" style="display:inline-flex;align-items:center;justify-content:center;width:24px;height:20px;border-radius:6px;background:#FFFFFF;box-shadow:inset 0 0 0 1px #D5DBE4;font-size:11px;font-weight:600">{{m.letter}}</span><span class="m" style="display:inline-flex;align-items:center;gap:5px;font-size:10px;letter-spacing:.1em;color:{{m.stateInk}}"><span style="width:6px;height:6px;border-radius:50%;background:{{m.led}};animation:{{m.blink}}"></span>{{m.state}}</span></span>
<span style="display:flex;gap:2px" role="img" aria-label="Reading {{m.reading}}">
<sc-for list="{{m.digits}}" as="g" hint-placeholder-count="4"><span class="m" style="width:20px;height:28px;border-radius:5px;background:#FFFFFF;box-shadow:inset 0 0 0 1px #D5DBE4;font-size:15px;font-weight:600;line-height:28px;text-align:center">{{g}}</span></sc-for>
<span class="m" style="width:20px;height:28px;border-radius:5px;background:{{m.lastBg}};color:{{m.lastInk}};font-size:15px;font-weight:600;line-height:28px;text-align:center">9</span>
</span>
<span style="position:relative;width:96px;height:22px" aria-hidden="true"><span style="position:absolute;inset:0;border-radius:50%;background:#E3E8EF;box-shadow:inset 0 -3px 0 #C5CDD8"></span><span style="position:absolute;left:44px;top:7px;width:8px;height:8px;border-radius:2px;background:{{m.mark}};animation:{{m.disc}}"></span></span>
<span style="display:flex;align-items:baseline;gap:5px"><span class="d" style="font-size:38px;font-weight:600;line-height:1">{{m.left}}</span><span style="font-size:12px;color:#687386">to 120</span></span>
<span class="m" style="font-size:10.5px;color:#687386">{{m.checked}}</span>
</a>
</sc-for>
</div>
</section>

<sc-for list="{{meters}}" as="m" hint-placeholder-count="2">
<section aria-label="{{m.name}} against the slabs" class="card" style="padding:10px 14px 4px">
<div style="display:flex;align-items:baseline;gap:8px"><span style="font-size:14px;font-weight:600">{{m.name}}</span><span style="font-size:12px;color:#687386">{{m.used}} used</span><span class="m" style="margin-left:auto;font-size:10.5px;color:{{m.paceInk}}">{{m.pace}}</span></div>
<svg viewBox="0 0 330 42" width="100%" height="42" role="img" aria-label="{{m.used}} of 120 used">
<line x1="6" y1="16" x2="324" y2="16" stroke="#D5DBE4" stroke-width="2"></line>
<line x1="6" y1="16" x2="{{m.x}}" y2="16" stroke="#2869D8" stroke-width="4" stroke-linecap="round"></line>
<line x1="{{m.x}}" y1="16" x2="{{m.px}}" y2="16" stroke="#2869D8" stroke-width="2" stroke-dasharray="3 6" style="animation:flow 1.2s linear infinite"></line>
<circle cx="196.8" cy="16" r="6" fill="#FFFFFF" stroke="#B7791F" stroke-width="2.2"></circle>
<circle cx="292" cy="16" r="6" fill="#FFFFFF" stroke="#D2453B" stroke-width="2.2"></circle>
<circle cx="{{m.x}}" cy="16" r="5.5" fill="#2869D8" stroke="#FFFFFF" stroke-width="2.5"></circle>
<text x="196.8" y="38" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" fill="#4B5566">120</text>
<text x="292" y="38" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" fill="#4B5566">180</text>
</svg>
</section>
</sc-for>

<section aria-label="Room before a price jump" class="card" style="padding:12px 14px;display:flex;align-items:center;gap:12px">
<span class="d" style="font-size:40px;font-weight:600;line-height:1">189</span>
<span style="font-size:13px;line-height:1.4;color:#4B5566">units before a price jump. B passes 120 around <span class="m" style="color:#8A5A12">23 Nov</span>, then it is the 180 meter.</span>
</section>

<a href="#" style="display:flex;align-items:center;justify-content:center;gap:10px;min-height:54px;border-radius:14px;background:#2869D8;color:#FFFFFF;font-size:16px;font-weight:600;text-decoration:none">Read the meters<span class="m" style="font-size:11px;font-weight:500;opacity:.8">A due Fri</span></a>
</div>

<div style="position:absolute;left:0;right:0;bottom:0"><dc-import name="HubNav" active="electricity" light="{{true}}" hint-size="390px,84px"></dc-import></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const X = (u) => Math.min(324, 6 + (u / 200) * 318);
return {
meters: [
{ name: 'Meter A', letter: 'A', state: 'IDLE', stateInk: '#687386', led: '#C5CDD8', blink: 'none', ring: '#D5DBE4', reading: '17,489', digits: ['1', '7', '4', '8'], lastBg: '#C5CDD8', lastInk: '#171D29', mark: '#A3ADBD', disc: 'none', left: '96', checked: 'read 3 days ago', used: '24', x: X(24), px: X(60), pace: 'pace ~60', paceInk: '#167A52' },
{ name: 'Meter B', letter: 'B', state: 'LIVE', stateInk: '#2869D8', led: '#2869D8', blink: 'pulse 2s ease-in-out infinite', ring: 'rgba(40,105,216,.55)', reading: '37,429', digits: ['3', '7', '4', '2'], lastBg: '#2869D8', lastInk: '#FFFFFF', mark: '#2869D8', disc: 'disc 1.6s linear infinite', left: '33', checked: 'read today', used: '87', x: X(87), px: X(217), pace: 'pace ~217', paceInk: '#8A5A12' },
],
};
}
}
</script>
</body>
</html>
