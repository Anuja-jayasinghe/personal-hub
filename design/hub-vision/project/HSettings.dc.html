<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>hub Settings</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Oxanium:wght@400;500;600;700&family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Sora',Arial,sans-serif;color:#F2F5FA}
.d{font-family:'Oxanium',Arial,sans-serif;letter-spacing:-.025em}
.m{font-family:'JetBrains Mono',monospace}
.eb{font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:#929EAF}
.card{background:#1A2230;border:1px solid #303B4B;border-radius:18px}
</style>
</helmet>
<div style="position:relative;width:390px;height:1000px;background:#11151D;overflow:hidden">
<div style="padding:18px 16px 0;display:flex;flex-direction:column;gap:12px">

<header style="display:flex;align-items:center;gap:12px">
<dc-import name="HubMark" size="30" color="#4388F5" hint-size="24px,30px"></dc-import>
<div><span class="eb">hub · v1</span><h1 class="d" style="margin:2px 0 0;font-size:28px;font-weight:600;line-height:1">Settings</h1></div>
</header>

<section aria-label="Look" class="card" style="padding:14px">
<span class="eb">Look</span>
<div role="radiogroup" aria-label="Theme" style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px">
<sc-for list="{{themes}}" as="t" hint-placeholder-count="3">
<span role="radio" aria-checked="{{t.checked}}" style="display:flex;flex-direction:column;gap:6px;padding:6px;border-radius:14px;box-shadow:inset 0 0 0 {{t.ringW}} {{t.ring}}">
<span style="position:relative;display:block;height:64px;border-radius:10px;overflow:hidden;background:{{t.bg}};box-shadow:inset 0 0 0 1px {{t.edge}}">
<span style="position:absolute;left:8px;top:8px;width:44%;height:22px;border-radius:6px;background:{{t.hero}}"></span>
<span style="position:absolute;left:8px;right:8px;top:40px;height:2px;background:{{t.track}}"></span>
<span style="position:absolute;left:8px;width:34%;top:39px;height:4px;border-radius:2px;background:{{t.blue}}"></span>
<span style="position:absolute;left:calc(8px + 34% - 4px);top:37px;width:8px;height:8px;border-radius:50%;background:{{t.blue}}"></span>
<span style="position:absolute;right:8px;top:12px;width:9px;height:12px;border-radius:2px;background:{{t.blue}}"></span>
<span style="position:absolute;right:0;top:0;bottom:0;width:{{t.split}};background:#ECF0F5;opacity:{{t.splitOn}}"></span>
</span>
<span style="font-size:12px;font-weight:600;text-align:center">{{t.label}}</span>
</span>
</sc-for>
</div>
</section>

<section aria-label="Parts of the hub" class="card" style="padding:4px 14px">
<span class="eb" style="display:block;margin:10px 0 4px">Parts of the hub</span>
<sc-for list="{{modules}}" as="m" hint-placeholder-count="6">
<div style="display:flex;align-items:center;gap:12px;min-height:52px;border-top:1px solid #222D3D">
<span style="flex:none;display:flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:10px;background:rgba(34,45,61,.7);box-shadow:inset 0 0 0 1px #303B4B,inset 0 1px 0 rgba(255,255,255,.06)"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="{{m.ink}}" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{m.d}}"></path><sc-for list="{{m.nodes}}" as="p" hint-placeholder-count="2"><circle cx="{{p.x}}" cy="{{p.y}}" r="1.9" fill="{{m.ink}}" stroke="none"></circle></sc-for></svg></span>
<span style="flex:1;font-size:15px;font-weight:500;color:{{m.text}}">{{m.name}}</span>
<span role="switch" aria-checked="{{m.on}}" aria-label="{{m.name}}" style="position:relative;width:46px;height:28px;border-radius:999px;background:{{m.track}};box-shadow:inset 0 0 0 1px {{m.trackRing}}"><span style="position:absolute;top:4px;left:{{m.knob}};width:20px;height:20px;border-radius:50%;background:{{m.knobBg}}"></span></span>
</div>
</sc-for>
</section>

<section aria-label="More settings" class="card" style="padding:4px 14px">
<sc-for list="{{pages}}" as="l" hint-placeholder-count="5">
<a href="#" style="display:flex;align-items:center;gap:12px;min-height:54px;border-top:{{l.line}};text-decoration:none;color:#F2F5FA">
<span style="flex:1"><span style="display:block;font-size:14px;font-weight:600">{{l.label}}</span><span style="display:block;font-size:11.5px;color:#A3ADBD">{{l.hint}}</span></span>
<span class="m" style="font-size:10px;letter-spacing:.08em;color:{{l.metaInk}}">{{l.meta}}</span>
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#4A5668" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg>
</a>
</sc-for>
</section>

<a href="#" style="display:flex;align-items:center;justify-content:center;min-height:48px;border-radius:12px;box-shadow:inset 0 0 0 1px #303B4B;color:#FF8F87;font-size:14px;font-weight:600;text-decoration:none">Sign out</a>
</div>

<div style="position:absolute;left:0;right:0;bottom:0"><dc-import name="HubNav" active="more" hint-size="390px,84px"></dc-import></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1000}}'>
class Component extends DCLogic {
renderVals() {
const P = (pts) => pts.map(([x, y]) => ({ x, y }));
const sw = (on) => ({ on: String(on), track: on ? '#4388F5' : '#222D3D', trackRing: on ? '#4388F5' : '#303B4B', knob: on ? '22px' : '4px', knobBg: on ? '#0D1118' : '#929EAF', ink: on ? '#B7C0CD' : '#4A5668', text: on ? '#F2F5FA' : '#929EAF' });
return {
themes: [
{ label: 'Dark', checked: 'true', ring: '#4388F5', ringW: '1.5px', bg: '#11151D', edge: '#303B4B', hero: '#1A2230', track: '#303B4B', blue: '#4388F5', split: '0', splitOn: 0 },
{ label: 'Light', checked: 'false', ring: '#303B4B', ringW: '1px', bg: '#ECF0F5', edge: '#D5DBE4', hero: '#FFFFFF', track: '#D5DBE4', blue: '#2869D8', split: '0', splitOn: 0 },
{ label: 'Follow phone', checked: 'false', ring: '#303B4B', ringW: '1px', bg: '#11151D', edge: '#303B4B', hero: '#1A2230', track: '#303B4B', blue: '#4388F5', split: '50%', splitOn: 1 },
],
modules: [
{ name: 'Electricity', d: 'M13 3L6 13h6l-1 8 7-10h-6z', nodes: P([[13, 3], [11, 21]]), ...sw(true) },
{ name: 'Bills', d: 'M7 3h10v18l-2.5-1.5L12 21l-2.5-1.5L7 21zM10 8h4M10 12h4', nodes: P([[7, 3], [17, 3]]), ...sw(true) },
{ name: 'Vehicles', d: 'M3 16h18M5.5 16l2-5.5h9l2 5.5', nodes: P([[7.5, 19], [16.5, 19]]), ...sw(true) },
{ name: 'Reminders', d: 'M6 16v-5a6 6 0 0 1 12 0v5l2 2H4zM10 21h4', nodes: P([[12, 5]]), ...sw(true) },
{ name: 'Tasks and notes', d: 'M4 7l2 2 3.5-3.5M4 16l2 2 3.5-3.5M13 7.5h7M13 16.5h7', nodes: P([[20, 7.5], [20, 16.5]]), ...sw(true) },
{ name: 'Warranties', d: 'M12 3l7 3v5c0 5-3 8-7 10-4-2-7-5-7-10V6z', nodes: P([[12, 3], [5, 6], [19, 6]]), ...sw(false) },
],
pages: [
{ label: 'Meters and rules', hint: '120 / 180, live meter, read every 5 days', meta: '2 METERS', metaInk: '#929EAF', line: '0' },
{ label: 'Notifications', hint: 'phone, weekly email, quiet hours', meta: '4 ON', metaInk: '#929EAF', line: '1px solid #222D3D' },
{ label: 'People and roles', hint: 'who can see and do what', meta: 'OWNER', metaInk: '#4388F5', line: '1px solid #222D3D' },
{ label: 'Activity', hint: 'every change, with who made it', meta: '6 THIS WEEK', metaInk: '#929EAF', line: '1px solid #222D3D' },
{ label: 'Data and backup', hint: 'backups, exports, delete everything', meta: 'TODAY 03:00', metaInk: '#929EAF', line: '1px solid #222D3D' },
],
rules: [
{ value: '120', label: 'low slab, units' },
{ value: '180', label: 'high slab, units' },
{ value: '10', label: 'warn this close' },
],
people: [
{ name: 'You', can: 'everything, and who sees what', initial: 'A', bg: '#1D355A', ring: 'rgba(67,136,245,.55)', role: 'OWNER', roleBg: '#4388F5', roleRing: '#4388F5', roleInk: '#0D1118' },
{ name: 'Father', can: 'reads meters, sees Electricity and Bills', initial: 'F', bg: '#222D3D', ring: '#303B4B', role: 'READER +', roleBg: 'transparent', roleRing: '#303B4B', roleInk: '#B7C0CD' },
],
};
}
}
</script>
</body>
</html>
