<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Switchboard Bills</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=Martian+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Archivo',system-ui,sans-serif;color:#16181D}
@keyframes led{0%,100%{opacity:1}50%{opacity:.45}}
</style>
</helmet>
<div style="position:relative;width:390px;height:900px;box-sizing:border-box;background:#ECEEF1;overflow:hidden">
<div style="padding:20px 16px 0;display:flex;flex-direction:column;gap:12px">

<header style="display:flex;align-items:center;gap:10px">
<svg width="34" height="34" viewBox="0 0 120 120" aria-hidden="true"><rect x="2" y="2" width="116" height="116" rx="28" fill="#16181D"></rect><path d="M26 72 V 50 L 56 26 L 86 50 V 72 H 22" fill="none" stroke="#F2F3F5" stroke-width="9" stroke-linejoin="round" stroke-linecap="round"></path><path d="M66 56 V 90 C 66 99 59 102 51 99" fill="none" stroke="#F2F3F5" stroke-width="9" stroke-linecap="round"></path><circle cx="66" cy="42" r="7" fill="#D2392C"></circle></svg>
<h1 style="margin:0;font-size:24px;font-weight:800;font-stretch:125%;letter-spacing:-0.02em">Bills</h1>
<a href="#" style="margin-left:auto;display:flex;align-items:center;min-height:40px;padding:0 14px;border-radius:12px;background:#16181D;color:#F2F3F5;font-size:14px;font-weight:700;text-decoration:none">+ Bill</a>
</header>

<section aria-label="To pay in the next 30 days" style="background:#16181D;border-radius:24px;padding:18px;color:#F2F3F5;display:flex;flex-direction:column;gap:14px">
<div style="display:flex;align-items:baseline;gap:8px"><span style="font-size:13px;color:#C9CED6">To pay</span><span style="margin-left:auto;font-family:'Martian Mono',monospace;font-size:11px;color:#C9CED6">next 30 days</span></div>
<p style="margin:0;font-size:40px;font-weight:800;font-stretch:125%;letter-spacing:-0.02em;line-height:1">LKR 7,913.84</p>
<div style="position:relative;height:62px" role="img" aria-label="A 30-day strip: today on 17 November, two bills due on 4 December">
<div style="position:absolute;left:0;right:0;top:34px;height:2px;background:#2A2E35"></div>
<sc-for list="{{days}}" as="d" hint-placeholder-count="31"><span style="position:absolute;left:{{d.x}}%;top:{{d.top}}px;width:1.5px;height:{{d.h}}px;background:#4B515C"></span></sc-for>
<span style="position:absolute;left:0;top:18px;width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;border-top:10px solid #D2392C;transform:translateX(-6px)"></span>
<span style="position:absolute;left:56.7%;top:6px;display:flex;flex-direction:column;align-items:center;transform:translateX(-50%);gap:2px">
<span style="width:24px;height:10px;border-radius:3px;background:#F2A417"></span><span style="width:24px;height:10px;border-radius:3px;background:#F2A417;opacity:.7"></span>
</span>
<span style="position:absolute;left:0;top:44px;font-family:'Martian Mono',monospace;font-size:10px;color:#C9CED6">today</span>
<span style="position:absolute;left:56.7%;top:44px;transform:translateX(-50%);font-family:'Martian Mono',monospace;font-size:10px;color:#F2A417">4 Dec</span>
<span style="position:absolute;right:0;top:44px;font-family:'Martian Mono',monospace;font-size:10px;color:#C9CED6">17 Dec</span>
</div>
</section>

<section aria-label="Due" style="background:#F8F9FA;border-radius:20px;padding:6px 14px;box-shadow:0 0 0 1px rgba(22,24,29,.1)">
<sc-for list="{{due}}" as="b" hint-placeholder-count="2">
<div style="display:flex;align-items:center;gap:12px;min-height:64px;border-bottom:1px solid #E3E6EA">
<span style="width:10px;height:10px;border-radius:50%;background:#F2A417;animation:led 2.4s ease-in-out infinite"></span>
<span style="flex:1"><span style="display:block;font-size:15px;font-weight:700">{{b.name}}</span><span style="display:block;font-size:12px;color:#4B515C">{{b.sub}}</span></span>
<span style="font-family:'Martian Mono',monospace;font-size:13px;font-weight:600">{{b.amount}}</span>
<a href="#" style="display:flex;align-items:center;min-height:40px;padding:0 10px;border-radius:12px;box-shadow:inset 0 0 0 1.5px #16181D;color:#16181D;font-size:12px;font-weight:700;text-decoration:none">Paid</a>
</div>
</sc-for>
<p style="margin:10px 0;font-size:12px;color:#4B515C">Due in 17 days. Marking one paid asks first, and can be undone.</p>
</section>

<section aria-label="Paid so far" style="background:#F8F9FA;border-radius:20px;padding:14px;box-shadow:0 0 0 1px rgba(22,24,29,.1)">
<h2 style="margin:0 0 10px;font-size:16px;font-weight:700">Paid so far</h2>
<sc-for list="{{history}}" as="h" hint-placeholder-count="2">
<div style="display:flex;align-items:center;gap:10px;min-height:40px">
<span style="width:64px;font-size:13px;font-weight:700">{{h.meter}}</span>
<sc-for list="{{h.months}}" as="m" hint-placeholder-count="3">
<span style="display:flex;flex-direction:column;align-items:center;gap:3px;width:42px"><span style="width:14px;height:14px;border-radius:50%;box-sizing:border-box;background:{{m.fill}};border:2px solid {{m.ring}}"></span><span style="font-family:'Martian Mono',monospace;font-size:10px;color:#4B515C">{{m.label}}</span></span>
</sc-for>
</div>
</sc-for>
</section>

<section aria-label="Subscriptions" style="border-radius:20px;padding:14px;box-shadow:inset 0 0 0 1.5px #C9CED6;display:flex;align-items:center;gap:12px">
<span style="flex:1"><span style="display:block;font-size:15px;font-weight:700">Subscriptions</span><span style="display:block;font-size:12px;color:#4B515C">Nothing tracked yet. Add one to see it on this strip.</span></span>
<a href="#" style="display:flex;align-items:center;min-height:40px;padding:0 12px;border-radius:12px;background:#16181D;color:#F2F3F5;font-size:13px;font-weight:700;text-decoration:none">Add</a>
</section>
</div>

<nav aria-label="Main" style="position:absolute;left:0;right:0;bottom:0;height:78px;box-sizing:border-box;padding:6px 18px 18px;background:#F8F9FA;box-shadow:0 -1px 0 rgba(22,24,29,.1);display:flex;justify-content:space-between;align-items:center">
<sc-for list="{{nav}}" as="n" hint-placeholder-count="5">
<a href="#" aria-label="{{n.label}}" style="position:relative;display:block;width:52px;height:52px;border-radius:16px;background:{{n.bg}}">
<span style="position:absolute;right:7px;top:6px;width:24px;height:24px;border-radius:{{n.shape}};background:linear-gradient(140deg,{{n.c1}},{{n.c2}})"></span>
<span style="position:absolute;left:7px;bottom:7px;width:32px;height:32px;border-radius:11px;background:rgba(255,255,255,.4);border:1px solid rgba(255,255,255,.9);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 6px 12px -8px rgba(22,24,29,.5);display:flex;align-items:center;justify-content:center"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#16181D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{n.d}}"></path></svg></span>
</a>
</sc-for>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":900}}'>
class Component extends DCLogic {
renderVals() {
const nav = [
{ label: 'Home', d: 'M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z', c1: '#FF9A6B', c2: '#E5532E', shape: '50%' },
{ label: 'Vehicles', d: 'M3 15h18v3H3zM6 15l1.8-5a2 2 0 0 1 1.9-1.3h4.6a2 2 0 0 1 1.9 1.3L18 15', c1: '#7BB2FF', c2: '#2F5BFF', shape: '50% 50% 8px 8px' },
{ label: 'Electricity', d: 'M13 2L5 13h6l-1 8 8-11h-6z', c1: '#FFD54A', c2: '#E8930C', shape: '8px' },
{ label: 'Bills', d: 'M6 3h12v16l-3-2-3 2-3-2-3 2zM9 8h6M9 12h6', c1: '#6FE7AE', c2: '#16935E', shape: '8px', on: true },
{ label: 'More', d: 'M5 12h.01M12 12h.01M19 12h.01', c1: '#D5DAE1', c2: '#7A818C', shape: '50%' },
];
const days = [];
for (let i = 0; i <= 30; i++) days.push({ x: (i / 30) * 100, top: i % 7 === 0 ? 26 : 30, h: i % 7 === 0 ? 10 : 6 });
const paid = { fill: '#1FA971', ring: '#1FA971' };
const open = { fill: 'transparent', ring: '#F2A417' };
return {
nav: nav.map((n) => ({ ...n, bg: n.on ? '#E3E6EA' : 'transparent' })),
days,
due: [
{ name: 'Electricity, Meter B', sub: 'Nov 2026 · 143 kWh', amount: '4,709.74' },
{ name: 'Electricity, Meter A', sub: 'Nov 2026 · 117 kWh', amount: '3,204.10' },
],
history: [
{ meter: 'Meter A', months: [{ label: 'Sep', ...paid }, { label: 'Oct', ...paid }, { label: 'Nov', ...open }] },
{ meter: 'Meter B', months: [{ label: 'Sep', ...paid }, { label: 'Oct', ...paid }, { label: 'Nov', ...open }] },
],
};
}
}
</script>
</body>
</html>
