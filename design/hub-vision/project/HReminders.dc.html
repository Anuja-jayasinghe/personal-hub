<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>hub Reminders</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Oxanium:wght@400;500;600;700&family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Sora',Arial,sans-serif;color:#F2F5FA}
.d{font-family:'Oxanium',Arial,sans-serif;letter-spacing:-.025em}
.m{font-family:'JetBrains Mono',monospace}
.eb{font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:#929EAF}
.card{background:#1A2230;border:1px solid #303B4B;border-radius:18px}
</style>
</helmet>
<div style="position:relative;width:390px;height:900px;background:#11151D;overflow:hidden">
<div style="padding:18px 16px 0;display:flex;flex-direction:column;gap:12px">

<header style="display:flex;align-items:center;gap:12px">
<dc-import name="HubMark" size="30" color="#4388F5" hint-size="24px,30px"></dc-import>
<div><span class="eb">5 in the next 3 weeks</span><h1 class="d" style="margin:2px 0 0;font-size:28px;font-weight:600;line-height:1">Reminders</h1></div>
<a href="#" style="margin-left:auto;display:flex;align-items:center;min-height:40px;padding:0 14px;border-radius:12px;background:#4388F5;color:#0D1118;font-size:14px;font-weight:600;text-decoration:none">+ Reminder</a>
</header>

<section aria-label="The next three weeks" style="background:#0D1118;border:1px solid #222D3D;border-radius:24px;padding:14px 12px">
<div style="display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px">
<sc-for list="{{days}}" as="d" hint-placeholder-count="21">
<span style="display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 0;border-radius:10px;background:{{d.bg}};box-shadow:inset 0 0 0 1px {{d.ring}}">
<span class="m" style="font-size:9px;color:{{d.dim}}">{{d.wd}}</span>
<span class="d" style="font-size:15px;font-weight:{{d.weight}};color:{{d.ink}}">{{d.n}}</span>
<span style="display:flex;gap:2px;height:6px"><sc-for list="{{d.dots}}" as="c" hint-placeholder-count="1"><span style="width:6px;height:6px;border-radius:50%;background:{{c}}"></span></sc-for></span>
</span>
</sc-for>
</div>
</section>

<sc-for list="{{groups}}" as="g" hint-placeholder-count="2">
<section aria-label="{{g.title}}" class="card" style="padding:4px 14px">
<h2 class="eb" style="margin:10px 0 4px;font-weight:400">{{g.title}}</h2>
<sc-for list="{{g.items}}" as="r" hint-placeholder-count="2">
<div style="display:flex;align-items:center;gap:12px;min-height:62px;border-top:1px solid #222D3D">
<span style="flex:none;display:flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:10px;background:rgba(34,45,61,.7);box-shadow:inset 0 0 0 1px #303B4B,inset 0 1px 0 rgba(255,255,255,.06)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#B7C0CD" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{r.d}}"></path><sc-for list="{{r.nodes}}" as="p" hint-placeholder-count="2"><circle cx="{{p.x}}" cy="{{p.y}}" r="1.9" fill="#B7C0CD" stroke="none"></circle></sc-for></svg></span>
<span style="flex:1;min-width:0"><span style="display:block;font-size:15px;font-weight:600">{{r.title}}</span><span style="display:flex;align-items:center;gap:6px;font-size:12px;color:#A3ADBD">{{r.sub}}<span class="m" style="display:{{r.repeatShow}};padding:1px 6px;border-radius:6px;background:#222D3D;font-size:10px;color:#B7C0CD">{{r.repeat}}</span></span></span>
<span class="m" style="font-size:10.5px;color:{{r.whenInk}}">{{r.when}}</span>
</div>
</sc-for>
</section>
</sc-for>

<section aria-label="Your own reminders" style="border-radius:18px;padding:14px;border:1px dashed #303B4B;display:flex;align-items:center;gap:12px">
<span style="flex:1"><span style="display:block;font-size:15px;font-weight:600">Your own reminders</span><span style="display:block;font-size:12px;line-height:1.45;color:#A3ADBD">None yet. Anything with a date can live here and shows on the strip above.</span></span>
<a href="#" style="display:flex;align-items:center;min-height:40px;padding:0 12px;border-radius:12px;box-shadow:inset 0 0 0 1px #303B4B;color:#F2F5FA;font-size:13px;font-weight:600;text-decoration:none">Add</a>
</section>
</div>

<div style="position:absolute;left:0;right:0;bottom:0"><dc-import name="HubNav" active="more" hint-size="390px,84px"></dc-import></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":900}}'>
class Component extends DCLogic {
renderVals() {
const P = (pts) => pts.map(([x, y]) => ({ x, y }));
const wds = ['W', 'T', 'F', 'S', 'S', 'M', 'T'];
const blue = '#4388F5', amber = '#F5B94A';
const marks = { 20: [blue], 21: [blue], 25: [blue], 26: [blue], 34: [amber, amber] };
const days = [];
for (let i = 0; i < 21; i++) {
const date = 18 + i;
const n = date > 30 ? date - 30 : date;
const today = i === 0;
days.push({ wd: wds[i % 7], n: String(n), dots: marks[date] || [], bg: today ? '#1D355A' : 'transparent', ring: today ? 'rgba(67,136,245,.55)' : 'transparent', ink: today ? '#F2F5FA' : '#B7C0CD', dim: today ? '#B7C0CD' : '#4A5668', weight: today ? 700 : 500 });
}
const elec = { d: 'M13 3L6 13h6l-1 8 7-10h-6z', nodes: P([[13, 3], [11, 21]]) };
const bill = { d: 'M7 3h10v18l-2.5-1.5L12 21l-2.5-1.5L7 21zM10 8h4M10 12h4', nodes: P([[7, 3], [17, 3]]) };
const car = { d: 'M3 16h18M5.5 16l2-5.5h9l2 5.5', nodes: P([[7.5, 19], [16.5, 19]]) };
return {
days,
groups: [
{ title: 'This week', items: [
{ title: 'Read Meter A', sub: 'Electricity', repeat: 'EVERY 5 DAYS', repeatShow: 'inline-block', when: 'FRI 20', whenInk: '#F2F5FA', ...elec },
{ title: 'Read Meter B', sub: 'Electricity', repeat: 'EVERY 5 DAYS', repeatShow: 'inline-block', when: 'SAT 21', whenInk: '#F2F5FA', ...elec },
] },
{ title: 'Later', items: [
{ title: 'Pay 2 electricity bills', sub: 'LKR 7,913.84', repeat: '', repeatShow: 'none', when: '4 DEC', whenInk: '#F8CB72', ...bill },
{ title: 'Vehicle renewals', sub: 'Add them on each vehicle', repeat: '', repeatShow: 'none', when: '–', whenInk: '#4A5668', ...car },
] },
],
};
}
}
</script>
</body>
</html>
