<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>hub desktop rail</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600&display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<aside aria-label="Main" style="width:88px;height:900px;box-sizing:border-box;background:#0D1118;border-right:1px solid #222D3D;display:flex;flex-direction:column;align-items:center;gap:6px;padding:22px 0 18px">
<dc-import name="HubMark" size="40" color="#4388F5" hint-size="32px,40px"></dc-import>
<span style="height:22px"></span>
<sc-for list="{{items}}" as="n" hint-placeholder-count="7">
<a href="#" aria-label="{{n.label}}" aria-current="{{n.current}}" style="display:flex;flex-direction:column;align-items:center;gap:4px;width:72px;padding:8px 0;border-radius:14px;background:{{n.bg}};box-shadow:inset 0 0 0 1px {{n.ring}};text-decoration:none">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{n.ink}}" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{n.d}}"></path><sc-for list="{{n.nodes}}" as="p" hint-placeholder-count="2"><circle cx="{{p.x}}" cy="{{p.y}}" r="1.9" fill="{{n.ink}}" stroke="none"></circle></sc-for></svg>
<span style="font-family:'Sora',Arial,sans-serif;font-size:10.5px;font-weight:{{n.weight}};color:{{n.text}}">{{n.label}}</span>
</a>
</sc-for>
<span style="margin-top:auto;display:flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:50%;background:#222D3D;box-shadow:inset 0 0 0 1px #303B4B;font-family:'Sora',Arial,sans-serif;font-size:14px;font-weight:600;color:#F2F5FA">A</span>
</aside>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","default":"home","options":["home","electricity","vehicles","bills","reminders","tasks","settings"]},"$preview":{"width":88,"height":900}}'>
class Component extends DCLogic {
renderVals() {
const active = this.props.active ?? 'home';
const P = (pts) => pts.map(([x, y]) => ({ x, y }));
const defs = [
{ key: 'home', label: 'Home', d: 'M4 11l8-7 8 7M6 9.5V20h12V9.5', nodes: P([[12, 4], [4, 11], [20, 11]]) },
{ key: 'electricity', label: 'Electricity', d: 'M13 3L6 13h6l-1 8 7-10h-6z', nodes: P([[13, 3], [11, 21]]) },
{ key: 'vehicles', label: 'Vehicles', d: 'M3 16h18M5.5 16l2-5.5h9l2 5.5', nodes: P([[7.5, 19], [16.5, 19]]) },
{ key: 'bills', label: 'Bills', d: 'M7 3h10v18l-2.5-1.5L12 21l-2.5-1.5L7 21zM10 8h4M10 12h4', nodes: P([[7, 3], [17, 3]]) },
{ key: 'reminders', label: 'Reminders', d: 'M6 16v-5a6 6 0 0 1 12 0v5l2 2H4zM10 21h4', nodes: P([[12, 5]]) },
{ key: 'tasks', label: 'Tasks', d: 'M4 7l2 2 3.5-3.5M4 16l2 2 3.5-3.5M13 7.5h7M13 16.5h7', nodes: P([[20, 7.5], [20, 16.5]]) },
{ key: 'settings', label: 'Settings', d: 'M12 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6zM12 3v4M12 17v4M3 12h4M17 12h4', nodes: P([[12, 3], [12, 21], [3, 12], [21, 12]]) },
];
return {
items: defs.map((n) => {
const on = n.key === active;
return { ...n, current: on ? 'page' : 'false', bg: on ? '#1D355A' : 'transparent', ring: on ? 'rgba(67,136,245,.45)' : 'transparent', ink: on ? '#4388F5' : '#929EAF', text: on ? '#F2F5FA' : '#929EAF', weight: on ? 600 : 500 };
}),
};
}
}
</script>
</body>
</html>
