<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sign in</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=Martian+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Archivo',system-ui,sans-serif;color:#16181D}
@keyframes current{to{stroke-dashoffset:-30}}
@keyframes lamp{0%,100%{opacity:1}50%{opacity:.4}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
</style>
</helmet>
<div style="display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);width:1440px;height:900px">

<section aria-label="hub" style="position:relative;background:#0D0F12;color:#F2F3F5;padding:64px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden">
<svg width="100%" height="100%" viewBox="0 0 800 900" aria-hidden="true" style="position:absolute;inset:0;opacity:.35">
<sc-for list="{{grid}}" as="l" hint-placeholder-count="20"><line x1="{{l.x1}}" y1="{{l.y1}}" x2="{{l.x2}}" y2="{{l.y2}}" stroke="#20242B" stroke-width="1"></line></sc-for>
</svg>
<div style="position:relative;display:flex;align-items:center;gap:12px">
<svg width="40" height="40" viewBox="0 0 120 120" aria-hidden="true"><path d="M22 66 V 44 L 56 18 L 90 44 V 66" fill="none" stroke="#F2F3F5" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"></path><path d="M14 66 H 100" stroke="#F2F3F5" stroke-width="8" stroke-linecap="round"></path><circle cx="104" cy="66" r="6" fill="#B5713A"></circle><circle cx="42" cy="54.5" r="7" fill="none" stroke="#F2F3F5" stroke-width="7"></circle><path d="M49 47 V 62M66 48 V 92 C 66 104 56 108 46 103" fill="none" stroke="#F2F3F5" stroke-width="7" stroke-linecap="round"></path><circle cx="66" cy="35" r="6.5" fill="#D2392C"></circle></svg>
<span style="font-size:26px;font-weight:800;font-stretch:125%">hub</span>
</div>
<div style="position:relative;display:flex;justify-content:center">
<svg width="440" height="440" viewBox="0 0 120 120" role="img" aria-label="The hub mark, large, with current running along its floor">
<path d="M22 66 V 44 L 56 18 L 90 44 V 66" fill="none" stroke="#F2F3F5" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"></path>
<path d="M6 66 H 106" fill="none" stroke="#F2F3F5" stroke-width="4.5" stroke-linecap="round"></path>
<path d="M6 66 H 106" fill="none" stroke="#F2A417" stroke-width="2.4" stroke-dasharray="1.5 13.5" stroke-linecap="round" style="animation:current 1.4s linear infinite"></path>
<circle cx="110" cy="66" r="3.6" fill="#B5713A"></circle>
<circle cx="42" cy="54.5" r="7" fill="none" stroke="#F2F3F5" stroke-width="4.5"></circle>
<path d="M49 47 V 62" stroke="#F2F3F5" stroke-width="4.5" stroke-linecap="round"></path>
<path d="M66 48 V 92 C 66 104 56 108 46 103" fill="none" stroke="#F2F3F5" stroke-width="4.5" stroke-linecap="round"></path>
<circle cx="66" cy="36" r="4.5" fill="#D2392C" style="animation:lamp 2.4s ease-in-out infinite"></circle>
</svg>
</div>
<div style="position:relative">
<p style="margin:0;font-size:44px;font-weight:800;font-stretch:125%;letter-spacing:-0.02em;line-height:1.05;max-width:16ch">Everything the house runs on, in one place.</p>
<div style="display:flex;gap:10px;margin-top:22px">
<sc-for list="{{icons}}" as="ic" hint-placeholder-count="6">
<span style="position:relative;display:block;width:56px;height:56px;animation:float 6s ease-in-out infinite;animation-delay:{{ic.delay}}">
<span style="position:absolute;right:6px;top:5px;width:28px;height:28px;border-radius:{{ic.shape}};background:linear-gradient(140deg,{{ic.c1}},{{ic.c2}})"></span>
<span style="position:absolute;left:6px;bottom:6px;width:36px;height:36px;border-radius:12px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.3);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#F2F3F5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ic.d}}"></path></svg></span>
</span>
</sc-for>
</div>
</div>
</section>

<section aria-label="Sign in" style="background:#ECEEF1;display:flex;align-items:center;justify-content:center;padding:48px">
<form style="width:100%;max-width:400px;display:flex;flex-direction:column;gap:16px;background:#F8F9FA;border-radius:28px;padding:32px;box-shadow:0 0 0 1px rgba(22,24,29,.1),0 30px 60px -36px rgba(22,24,29,.5)">
<h1 style="margin:0;font-size:32px;font-weight:800;font-stretch:125%;letter-spacing:-0.02em">Sign in</h1>
<p style="margin:0;font-size:15px;line-height:1.5;color:#2C3038">Only people you invite can open the hub.</p>
<label style="display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600">Email
<input type="email" placeholder="you@example.com" style="height:48px;border-radius:14px;border:1.5px solid #C9CED6;background:#FFFFFF;padding:0 14px;font-family:inherit;font-size:15px"></input>
</label>
<button type="button" style="min-height:52px;border:0;border-radius:14px;background:#16181D;color:#F2F3F5;font-family:inherit;font-size:16px;font-weight:700;font-stretch:112%">Send me a code</button>
<div style="display:flex;align-items:center;gap:10px;color:#4B515C;font-size:13px"><span style="flex:1;height:1px;background:#DDE0E5"></span>or<span style="flex:1;height:1px;background:#DDE0E5"></span></div>
<button type="button" style="min-height:52px;border:0;border-radius:14px;background:#FFFFFF;color:#16181D;font-family:inherit;font-size:15px;font-weight:700;box-shadow:inset 0 0 0 1.5px #C9CED6">Continue with Google</button>
<p style="margin:0;display:flex;align-items:center;gap:8px;font-size:12px;color:#4B515C"><span style="width:8px;height:8px;border-radius:50%;background:#1FA971"></span>The code arrives in a few seconds and works once.</p>
</form>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
renderVals() {
const grid = [];
for (let i = -8; i <= 12; i++) {
grid.push({ x1: i * 70, y1: 900, x2: i * 70 + 520, y2: 0 });
grid.push({ x1: i * 70 + 520, y1: 900, x2: i * 70, y2: 0 });
}
const icons = [
{ c1: '#FF9A6B', c2: '#E5532E', shape: '50%', d: 'M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z' },
{ c1: '#FFD54A', c2: '#E8930C', shape: '8px', d: 'M13 2L5 13h6l-1 8 8-11h-6z' },
{ c1: '#7BB2FF', c2: '#2F5BFF', shape: '50% 50% 8px 8px', d: 'M3 15h18v3H3zM6 15l1.8-5a2 2 0 0 1 1.9-1.3h4.6a2 2 0 0 1 1.9 1.3L18 15' },
{ c1: '#6FE7AE', c2: '#16935E', shape: '8px', d: 'M6 3h12v16l-3-2-3 2-3-2-3 2zM9 8h6M9 12h6' },
{ c1: '#C2B4FF', c2: '#6C4CF0', shape: '8px 16px', d: 'M7 3h7l5 5v13H7zM14 3v5h5' },
{ c1: '#7DEAF5', c2: '#1495B8', shape: '50% 50% 50% 8px', d: 'M12 3l7 3v5c0 5-3 8-7 10-4-2-7-5-7-10V6z' },
];
return { grid, icons: icons.map((ic, i) => ({ ...ic, delay: `${-i * 0.8}s` })) };
}
}
</script>
</body>
</html>
