<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Settings</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=Martian+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Archivo',system-ui,sans-serif;color:#16181D}
</style>
</helmet>
<div style="position:relative;width:390px;height:1000px;background:#ECEEF1;overflow:hidden">
<div style="padding:20px 16px 0;display:flex;flex-direction:column;gap:12px">

<header style="display:flex;align-items:center;gap:10px">
<span style="position:relative;width:34px;height:34px"><span style="position:absolute;right:0;top:0;width:22px;height:22px;border-radius:50%;background:linear-gradient(140deg,#D5DAE1,#7A818C)"></span><span style="position:absolute;left:0;bottom:0;width:24px;height:24px;border-radius:8px;background:rgba(255,255,255,.45);border:1px solid rgba(255,255,255,.9);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#16181D" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="3.5"></circle><path d="M12 2v3M12 19v3M2 12h3M19 12h3"></path></svg></span></span>
<h1 style="margin:0;font-size:24px;font-weight:800;font-stretch:125%;letter-spacing:-0.02em">Settings</h1>
</header>

<section aria-label="Look" style="background:#F8F9FA;border-radius:20px;padding:14px;box-shadow:0 0 0 1px rgba(22,24,29,.1)">
<h2 style="margin:0 0 10px;font-size:15px;font-weight:700">Look</h2>
<div role="radiogroup" aria-label="Theme" style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px">
<sc-for list="{{themes}}" as="t" hint-placeholder-count="3">
<span role="radio" aria-checked="{{t.checked}}" style="display:flex;flex-direction:column;gap:6px;padding:6px;border-radius:14px;box-shadow:inset 0 0 0 {{t.ringW}} {{t.ring}}">
<span style="position:relative;display:block;height:64px;border-radius:10px;overflow:hidden;background:{{t.bg}}">
<span style="position:absolute;left:8px;top:8px;width:44%;height:22px;border-radius:6px;background:{{t.hero}}"></span>
<span style="position:absolute;left:8px;right:8px;top:36px;height:8px;border-radius:3px;background:{{t.card}}"></span>
<span style="position:absolute;left:8px;width:30%;top:36px;height:8px;border-radius:3px;background:{{t.fill}}"></span>
<span style="position:absolute;right:8px;top:12px;width:8px;height:8px;border-radius:50%;background:#D2392C"></span>
<span style="position:absolute;left:0;top:0;bottom:0;width:{{t.split}};background:#0D0F12;opacity:{{t.splitOn}}"></span>
</span>
<span style="font-size:12px;font-weight:700;text-align:center">{{t.label}}</span>
</span>
</sc-for>
</div>
</section>

<section aria-label="Parts of the hub" style="background:#F8F9FA;border-radius:20px;padding:6px 14px;box-shadow:0 0 0 1px rgba(22,24,29,.1)">
<h2 style="margin:8px 0 2px;font-size:15px;font-weight:700">Parts of the hub</h2>
<sc-for list="{{modules}}" as="m" hint-placeholder-count="6">
<div style="display:flex;align-items:center;gap:12px;min-height:52px;border-top:1px solid #E3E6EA">
<span style="position:relative;flex:none;width:28px;height:28px"><span style="position:absolute;right:0;top:0;width:17px;height:17px;border-radius:{{m.shape}};background:linear-gradient(140deg,{{m.c1}},{{m.c2}})"></span><span style="position:absolute;left:0;bottom:0;width:19px;height:19px;border-radius:7px;background:rgba(255,255,255,.5);border:1px solid rgba(255,255,255,.9);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)"></span></span>
<span style="flex:1;font-size:15px;font-weight:600">{{m.name}}</span>
<span role="switch" aria-checked="{{m.on}}" aria-label="{{m.name}}" style="position:relative;width:46px;height:28px;border-radius:999px;background:{{m.track}}"><span style="position:absolute;top:3px;left:{{m.knob}};width:22px;height:22px;border-radius:50%;background:#FFFFFF;box-shadow:0 1px 3px rgba(22,24,29,.35)"></span></span>
</div>
</sc-for>
</section>

<section aria-label="Electricity rules" style="background:#F8F9FA;border-radius:20px;padding:14px;box-shadow:0 0 0 1px rgba(22,24,29,.1);display:flex;flex-direction:column;gap:10px">
<h2 style="margin:0;font-size:15px;font-weight:700">Electricity rules</h2>
<div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px">
<sc-for list="{{rules}}" as="r" hint-placeholder-count="3">
<span style="display:flex;flex-direction:column;gap:2px;padding:10px;border-radius:14px;background:#ECEEF1"><span style="font-family:'Martian Mono',monospace;font-size:20px;font-weight:600">{{r.value}}</span><span style="font-size:11px;line-height:1.3;color:#4B515C">{{r.label}}</span></span>
</sc-for>
</div>
<p style="margin:0;font-size:12px;line-height:1.45;color:#4B515C">The first meter past 120 in a cycle becomes the 180 meter. Read each meter every 5 days.</p>
</section>

<section aria-label="People, coming later" style="border-radius:20px;padding:14px;box-shadow:inset 0 0 0 1.5px #C9CED6;display:flex;flex-direction:column;gap:10px">
<div style="display:flex;align-items:center;gap:8px"><h2 style="margin:0;font-size:15px;font-weight:700">People</h2><span style="display:inline-flex;align-items:center;min-height:22px;padding:0 8px;border-radius:6px;background:#E3E6EA;font-size:11px;font-weight:700;color:#2C3038">Phase 5 preview</span></div>
<sc-for list="{{people}}" as="p" hint-placeholder-count="2">
<div style="display:flex;align-items:center;gap:10px">
<span style="flex:none;display:flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:50%;background:{{p.bg}};color:#FFFFFF;font-size:14px;font-weight:800">{{p.initial}}</span>
<span style="flex:1;min-width:0"><span style="display:block;font-size:14px;font-weight:700">{{p.name}}</span><span style="display:block;font-size:12px;color:#4B515C">{{p.can}}</span></span>
<span style="display:inline-flex;align-items:center;min-height:28px;padding:0 10px;border-radius:999px;background:{{p.roleBg}};color:{{p.roleInk}};font-size:12px;font-weight:700">{{p.role}}</span>
</div>
</sc-for>
</section>

<a href="#" style="display:flex;align-items:center;justify-content:center;min-height:48px;border-radius:14px;box-shadow:inset 0 0 0 1.5px #C9CED6;color:#A3241A;font-size:14px;font-weight:700;text-decoration:none">Sign out</a>
</div>

<div style="position:absolute;left:0;right:0;bottom:0"><dc-import name="GlassNav" active="more" hint-size="390px,78px"></dc-import></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1000}}'>
class Component extends DCLogic {
renderVals() {
const sw = (on) => ({ on: String(on), track: on ? '#1FA971' : '#C9CED6', knob: on ? '21px' : '3px' });
return {
themes: [
{ label: 'Paper and ink', checked: 'true', ring: '#16181D', ringW: '2px', bg: '#ECEEF1', hero: '#16181D', card: '#DDE0E5', fill: '#16181D', split: '0', splitOn: 0 },
{ label: 'Night', checked: 'false', ring: '#C9CED6', ringW: '1.5px', bg: '#0D0F12', hero: '#20242B', card: '#2A2E35', fill: '#F2F3F5', split: '0', splitOn: 0 },
{ label: 'Follow phone', checked: 'false', ring: '#C9CED6', ringW: '1.5px', bg: '#ECEEF1', hero: '#16181D', card: '#DDE0E5', fill: '#16181D', split: '50%', splitOn: 1 },
],
modules: [
{ name: 'Electricity', c1: '#FFD54A', c2: '#E8930C', shape: '4px', ...sw(true) },
{ name: 'Bills', c1: '#6FE7AE', c2: '#16935E', shape: '4px', ...sw(true) },
{ name: 'Vehicles', c1: '#7BB2FF', c2: '#2F5BFF', shape: '50% 50% 4px 4px', ...sw(true) },
{ name: 'Reminders', c1: '#FF9DB0', c2: '#D93A65', shape: '50%', ...sw(true) },
{ name: 'Tasks and notes', c1: '#C2B4FF', c2: '#6C4CF0', shape: '4px 8px', ...sw(true) },
{ name: 'Warranties', c1: '#7DEAF5', c2: '#1495B8', shape: '50% 50% 50% 4px', ...sw(false) },
],
rules: [
{ value: '120', label: 'low slab, units' },
{ value: '180', label: 'high slab, units' },
{ value: '10', label: 'warn this close' },
],
people: [
{ name: 'You', can: 'everything, and who sees what', initial: 'A', bg: '#E5532E', role: 'Owner', roleBg: '#16181D', roleInk: '#F2F3F5' },
{ name: 'Father', can: 'reads meters, sees Electricity and Bills', initial: 'F', bg: '#2F5BFF', role: 'Reader +', roleBg: '#E3E6EA', roleInk: '#16181D' },
],
};
}
}
</script>
</body>
</html>
