# Shows the live site in the repo's "Deployments" panel (C125). Vercel reports each deployment as a commit
# status named "Vercel", not as a GitHub deployment, so when one succeeds for a commit on main (the
# production deployment), record it as a GitHub deployment of the Production environment, linked to the
# live address and to Vercel's build page.
name: Deployments

on:
  status:

permissions:
  deployments: write

jobs:
  record:
    name: Record the production deployment
    if: github.event.context == 'Vercel' && github.event.state == 'success' && contains(github.event.branches.*.name, 'main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const deployment = await github.rest.repos.createDeployment({
              owner, repo,
              ref: context.payload.sha,
              environment: "Production",
              description: "hub.anujajay.com",
              auto_merge: false,
              required_contexts: [],
              production_environment: true,
            });
            await github.rest.repos.createDeploymentStatus({
              owner, repo,
              deployment_id: deployment.data.id,
              state: "success",
              environment_url: "https://hub.anujajay.com",
              log_url: context.payload.target_url,
              auto_inactive: true,
            });
