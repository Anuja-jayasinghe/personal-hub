# The live end-to-end test (C121, C122, C123): after Vercel reports a successful production deployment, run
# `pnpm e2e` against hub.anujajay.com with the code that was deployed. It creates a TEST account and a TEST
# file and always deletes them. Secrets live in the repo's Actions secrets and are never printed.
name: Live e2e

# Vercel reports each deployment as a commit status named "Vercel" (not as a GitHub deployment); a successful
# one on a commit of main is the production deployment.
on:
  status:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-live
  cancel-in-progress: false

jobs:
  e2e:
    name: Sharing and upload on the live site
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.context == 'Vercel' && github.event.state == 'success' && contains(github.event.branches.*.name, 'main'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      E2E_BASE_URL: https://hub.anujajay.com
      E2E_CLERK_SECRET_KEY: ${{ secrets.E2E_CLERK_SECRET_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.sha || github.sha }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # No trace or screenshot is kept or uploaded: they would show the live site's real pages, and this
      # repo's run artifacts are public. To dig into a failure, run `pnpm e2e` locally.
      - run: pnpm e2e
