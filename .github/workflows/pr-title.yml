# Pull request titles become the squashed commit on main, and release-please reads them to pick the next
# version (C123): feat = new feature (minor), fix = fix (patch), anything with "!" = breaking. Example:
#   feat(vehicles): plate number in the address (#123)
name: PR title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  title:
    name: Conventional title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            docs
            test
            build
            ci
            chore
            revert
          requireScope: false
